<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>Nada Graduation</title>

<style>

/* ======================================
   RESET
====================================== */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
}

body{
  overflow:hidden;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#dcecf7;

  font-family:Arial,sans-serif;
}


/* ======================================
   STAGE
   الدعوة تبقى 9:16 على كل جهاز
====================================== */

.book{
  position:relative;

  /*
    أهم جزء:
    نأخذ أكبر حجم ممكن
    لكن نحافظ دائمًا على 9:16
  */

  width:min(
    100vw,
    calc(100dvh * 9 / 16)
  );

  aspect-ratio:9 / 16;

  max-height:100dvh;

  overflow:hidden;

  background:#dcecf7;

  perspective:2200px;

  touch-action:none;
}


/* ======================================
   PAGE
====================================== */

.page{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  overflow:hidden;

  background:#dcecf7;

  transform-origin:left center;

  transform-style:preserve-3d;

  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;

  transition:
    transform .9s cubic-bezier(.55,.05,.25,1);

  will-change:transform;
}


/* ======================================
   IMAGES
   لا قص ولا Zoom
====================================== */

.page > img{
  width:100%;
  height:100%;

  display:block;

  object-fit:contain;
  object-position:center;

  background:#dcecf7;

  image-rendering:auto;

  pointer-events:none;

  user-select:none;
  -webkit-user-select:none;
  -webkit-user-drag:none;
}


/* ======================================
   PAGE ORDER
====================================== */

.page:nth-of-type(1){z-index:80;}
.page:nth-of-type(2){z-index:70;}
.page:nth-of-type(3){z-index:60;}
.page:nth-of-type(4){z-index:50;}
.page:nth-of-type(5){z-index:40;}
.page:nth-of-type(6){z-index:30;}
.page:nth-of-type(7){z-index:20;}
.page:nth-of-type(8){z-index:10;}


/* ======================================
   NOTEBOOK PAGE FLIP
====================================== */

.page.flipped{
  transform:rotateY(-180deg);
  pointer-events:none;
}


/* ظل الورقة أثناء التقليب */

.page::after{
  content:"";

  position:absolute;
  inset:0;

  pointer-events:none;

  opacity:0;

  background:
    linear-gradient(
      90deg,
      rgba(0,0,0,.18),
      rgba(0,0,0,.05) 15%,
      transparent 40%
    );

  transition:opacity .4s ease;
}


.page.flipping::after{
  opacity:1;
}


/* ======================================
   VIDEO
====================================== */

.page-video{
  width:100%;
  height:100%;

  display:block;

  object-fit:contain;
  object-position:center;

  background:#dcecf7;

  border:0;
  outline:0;

  pointer-events:none;
}


video::-webkit-media-controls,
video::-webkit-media-controls-enclosure,
video::-webkit-media-controls-panel,
video::-webkit-media-controls-play-button,
video::-webkit-media-controls-start-playback-button{
  display:none !important;
}


/* ======================================
   MUSIC
====================================== */

.music-btn{
  position:absolute;

  top:14px;
  right:14px;

  z-index:1000;

  width:46px;
  height:46px;

  border:0;
  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(255,255,255,.94);

  color:#111;

  font-size:20px;

  cursor:pointer;

  box-shadow:
    0 5px 16px rgba(0,0,0,.14);
}


/* ======================================
   ARROWS
====================================== */

.nav-arrow{
  position:absolute;

  bottom:16px;

  z-index:900;

  width:46px;
  height:46px;

  border:0;
  border-radius:50%;

  background:rgba(255,255,255,.94);

  color:#222;

  display:flex;
  justify-content:center;
  align-items:center;

  font-size:28px;

  cursor:pointer;

  box-shadow:
    0 4px 14px rgba(0,0,0,.13);

  transition:opacity .25s ease;
}


#prevBtn{
  left:14px;
}


#nextBtn{
  right:14px;

  animation:
    nextMove 1.3s ease-in-out infinite;
}


@keyframes nextMove{

  0%,
  100%{
    transform:translateX(0);
  }

  50%{
    transform:translateX(-5px);
  }

}


.nav-arrow.hidden{
  opacity:0;
  pointer-events:none;
}


/*
أول صفحة:
ما في أسهم خارجية
لأن التصميم نفسه مكتوب عليه
Swipe to open
*/

.book.first-page .nav-arrow{
  opacity:0;
  pointer-events:none;
}


/* ======================================
   SWIPE LABEL
====================================== */

.swipe-label{
  position:absolute;

  left:50%;
  bottom:22px;

  transform:translateX(-50%);

  z-index:850;

  padding:6px 12px;

  border-radius:20px;

  background:rgba(255,255,255,.86);

  color:#555;

  font-size:11px;

  white-space:nowrap;

  pointer-events:none;
}


.book.first-page .swipe-label{
  display:none;
}


/* ======================================
   COUNTDOWN
====================================== */

.countdown-overlay{
  position:absolute;
  inset:0;

  z-index:100;

  pointer-events:none;
}


.countdown-number{
  position:absolute;

  /*
    النقطة نفسها هي مركز الرقم
  */

  transform:
    translate(-50%,-50%);

  display:flex;

  align-items:center;
  justify-content:center;

  text-align:center;

  min-width:18%;
  height:10%;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:
    clamp(28px,7vw,44px);

  font-weight:500;

  color:#202020;

  line-height:1;
}


/*
أرقام التايمر في وسط
المساحة البيضاء للمربعات
*/


#days{
  left:29%;
  top:47%;
}


#hours{
  left:68%;
  top:47%;
}


#minutes{
  left:29%;
  top:68%;
}


#seconds{
  left:68%;
  top:68%;
}


/* ======================================
   LOCATION
====================================== */

.location-click{
  position:absolute;

  z-index:500;

  left:20%;
  width:62%;

  bottom:10%;
  height:11%;

  display:block;

  background:transparent;
}


/* ======================================
   RSVP
====================================== */

.rsvp-click{
  position:absolute;

  z-index:500;

  left:20%;
  width:60%;

  top:58%;
  height:10%;

  display:block;

  background:transparent;
}


/* ======================================
   LAPTOP / DESKTOP
====================================== */

@media(min-width:700px){

  /*
    على اللابتوب الدعوة لا تتمدد
    على عرض الشاشة.
    تظهر مثل شاشة موبايل أنيقة
    في المنتصف.
  */

  .book{
    height:min(94dvh,900px);

    width:auto;

    aspect-ratio:9 / 16;

    border-radius:18px;

    box-shadow:
      0 20px 60px rgba(0,0,0,.16);
  }

}


/* ======================================
   VERY SMALL MOBILE
====================================== */

@media(max-width:380px){

  .music-btn,
  .nav-arrow{
    width:42px;
    height:42px;
  }

}

</style>
</head>


<body>


<div
  class="book first-page"
  id="book"
>


<!-- PAGE 01 -->

<section class="page">

  <img
    src="cover.png"
    alt="Nada Graduation"
  >

</section>



<!-- PAGE 02 VIDEO -->

<section class="page">

  <video
    id="nadaVideo"
    class="page-video"

    playsinline
    webkit-playsinline

    preload="auto"

    muted

    disablepictureinpicture

    controlslist="nodownload noplaybackrate nofullscreen"
  >

    <source
      src="video.mp4"
      type="video/mp4"
    >

  </video>

</section>



<!-- PAGE 03 -->

<section class="page">

  <img
    src="savetime.png"
    alt="Save the Time"
  >

</section>



<!-- PAGE 04 -->

<section class="page">

  <img
    src="date-time.png"
    alt="Date and Time"
  >

</section>



<!-- PAGE 05 COUNTDOWN -->

<section class="page">

  <img
    src="countdown.png"
    alt="Countdown"
  >


  <div class="countdown-overlay">

    <div
      id="days"
      class="countdown-number">
    </div>

    <div
      id="hours"
      class="countdown-number">
    </div>

    <div
      id="minutes"
      class="countdown-number">
    </div>

    <div
      id="seconds"
      class="countdown-number">
    </div>

  </div>

</section>



<!-- PAGE 06 LOCATION -->

<section class="page">

  <img
    src="location.png"
    alt="Location"
  >


  <a
    class="location-click"

    href="https://maps.app.goo.gl/1EMywhgSKpQ3VcEL6"

    target="_blank"

    rel="noopener noreferrer"

    aria-label="Open Location"
  ></a>

</section>



<!-- PAGE 07 DRESS CODE -->

<section class="page">

  <img
    src="dress-code.png"
    alt="Dress Code"
  >

</section>



<!-- PAGE 08 -->

<section class="page">

  <img
    src="rsvp.png"
    alt="Confirm Attendance"
  >


  <a
    class="rsvp-click"

    href="https://wa.me/970598494977?text=%D9%85%D8%B1%D8%AD%D8%A8%D8%A7%D9%8B%D8%8C%20%D8%A3%D8%A4%D9%83%D8%AF%20%D8%AD%D8%B6%D9%88%D8%B1%D9%8A%20%D9%84%D8%AD%D9%81%D9%84%20%D8%AA%D8%AE%D8%B1%D8%AC%20%D9%86%D8%AF%D9%89%20%F0%9F%8E%93%E2%9C%A8"

    target="_blank"

    rel="noopener noreferrer"

    aria-label="Confirm Attendance"
  ></a>

</section>



<!-- MUSIC -->

<audio
  id="bgMusic"
  loop
  preload="auto"
>

  <source
    src="music.mp3"
    type="audio/mpeg"
  >

</audio>


<button
  id="musicBtn"
  class="music-btn"
  type="button"
>
♪
</button>



<!-- PREVIOUS -->

<button
  id="prevBtn"
  class="nav-arrow hidden"
  type="button"
>
‹
</button>



<!-- SWIPE -->

<div
  id="swipeLabel"
  class="swipe-label"
>
اسحبي الصفحة
</div>



<!-- NEXT -->

<button
  id="nextBtn"
  class="nav-arrow hidden"
  type="button"
>
›
</button>


</div>


<script>

/* ======================================
   VARIABLES
====================================== */

const book =
  document.getElementById("book");


const pages =
  [...document.querySelectorAll(".page")];


const nextBtn =
  document.getElementById("nextBtn");


const prevBtn =
  document.getElementById("prevBtn");


const swipeLabel =
  document.getElementById("swipeLabel");


const nadaVideo =
  document.getElementById("nadaVideo");


const bgMusic =
  document.getElementById("bgMusic");


const musicBtn =
  document.getElementById("musicBtn");


let currentPage = 0;

let animating = false;

let musicPlaying = false;

let musicManuallyStopped = false;


/* ======================================
   NAVIGATION
====================================== */

function updateNavigation(){

  if(currentPage === 0){

    book.classList.add(
      "first-page"
    );


    prevBtn.classList.add(
      "hidden"
    );


    nextBtn.classList.add(
      "hidden"
    );


    return;

  }


  book.classList.remove(
    "first-page"
  );


  if(currentPage > 0){

    prevBtn.classList.remove(
      "hidden"
    );

  }


  if(
    currentPage ===
    pages.length - 1
  ){

    nextBtn.classList.add(
      "hidden"
    );


    swipeLabel.textContent =
      "الصفحة الأخيرة";

  }

  else{

    nextBtn.classList.remove(
      "hidden"
    );


    swipeLabel.textContent =
      "اسحبي الصفحة";

  }

}


/* ======================================
   NEXT
====================================== */

function nextPage(){

  if(animating) return;


  if(
    currentPage >=
    pages.length - 1
  ) return;


  animating = true;


  const page =
    pages[currentPage];


  page.classList.add(
    "flipping"
  );


  requestAnimationFrame(
    ()=>{

      page.classList.add(
        "flipped"
      );

    }
  );


  setTimeout(
    ()=>{

      page.classList.remove(
        "flipping"
      );


      currentPage++;


      updateNavigation();


      handleVideo();


      animating = false;

    },
    900
  );

}


/* ======================================
   PREVIOUS
====================================== */

function previousPage(){

  if(animating) return;

  if(currentPage <= 0) return;


  animating = true;


  const previous =
    pages[currentPage - 1];


  previous.classList.add(
    "flipping"
  );


  previous.classList.remove(
    "flipped"
  );


  setTimeout(
    ()=>{

      previous.classList.remove(
        "flipping"
      );


      currentPage--;


      updateNavigation();


      handleVideo();


      animating = false;

    },
    900
  );

}


/* ======================================
   BUTTONS
====================================== */

nextBtn.addEventListener(
  "click",
  ()=>{

    tryStartMusic();

    nextPage();

  }
);


prevBtn.addEventListener(
  "click",
  previousPage
);


/* ======================================
   SWIPE
====================================== */

let startX = 0;
let startY = 0;


book.addEventListener(
  "touchstart",
  event=>{

    if(
      event.target.closest("a") ||
      event.target.closest("button")
    ) return;


    const touch =
      event.touches[0];


    startX =
      touch.clientX;


    startY =
      touch.clientY;


    tryStartMusic();

  },
  {
    passive:true
  }
);


book.addEventListener(
  "touchend",
  event=>{

    if(
      event.target.closest("a") ||
      event.target.closest("button")
    ) return;


    const touch =
      event.changedTouches[0];


    const dx =
      touch.clientX -
      startX;


    const dy =
      touch.clientY -
      startY;


    if(
      Math.abs(dx) < 45
    ) return;


    if(
      Math.abs(dx) <
      Math.abs(dy)
    ) return;


    if(dx < 0){

      nextPage();

    }

    else{

      previousPage();

    }

  },
  {
    passive:true
  }
);


/* ======================================
   MOUSE
====================================== */

let dragging = false;

let mouseStart = 0;


book.addEventListener(
  "pointerdown",
  event=>{

    if(
      event.target.closest("a") ||
      event.target.closest("button")
    ) return;


    dragging = true;


    mouseStart =
      event.clientX;


    tryStartMusic();

  }
);


book.addEventListener(
  "pointerup",
  event=>{

    if(!dragging) return;


    dragging = false;


    const dx =
      event.clientX -
      mouseStart;


    if(
      Math.abs(dx) < 55
    ) return;


    if(dx < 0){

      nextPage();

    }

    else{

      previousPage();

    }

  }
);


/* ======================================
   VIDEO
====================================== */

function handleVideo(){

  /*
  الفيديو صفحة 2
  */

  if(currentPage === 1){

    nadaVideo.currentTime = 0;


    nadaVideo
    .play()
    .catch(()=>{});

  }

  else{

    nadaVideo.pause();

  }

}


/*
بمجرد انتهاء الفيديو
ينتقل تلقائياً
*/

nadaVideo.addEventListener(
  "ended",
  ()=>{

    if(currentPage !== 1) return;


    setTimeout(
      nextPage,
      150
    );

  }
);


/* ======================================
   MUSIC
====================================== */

async function tryStartMusic(){

  if(musicManuallyStopped) return;

  if(musicPlaying) return;


  try{

    bgMusic.volume =
      0.42;


    await bgMusic.play();


    musicPlaying = true;


    musicBtn.textContent =
      "♫";

  }

  catch(error){}

}


musicBtn.addEventListener(
  "click",
  async event=>{

    event.stopPropagation();


    if(musicPlaying){

      bgMusic.pause();


      musicPlaying =
        false;


      musicManuallyStopped =
        true;


      musicBtn.textContent =
        "♪";


      return;

    }


    try{

      musicManuallyStopped =
        false;


      bgMusic.volume =
        0.42;


      await bgMusic.play();


      musicPlaying =
        true;


      musicBtn.textContent =
        "♫";

    }

    catch(error){}

  }
);


/* ======================================
   COUNTDOWN
====================================== */

const eventDate =
  new Date(
    "2027-07-27T19:00:00+03:00"
  );


function updateCountdown(){

  let diff =
    eventDate.getTime() -
    Date.now();


  if(diff < 0){

    diff = 0;

  }


  const oneDay =
    1000 * 60 * 60 * 24;


  const oneHour =
    1000 * 60 * 60;


  const oneMinute =
    1000 * 60;


  const d =
    Math.floor(
      diff / oneDay
    );


  const h =
    Math.floor(
      (diff % oneDay) /
      oneHour
    );


  const m =
    Math.floor(
      (diff % oneHour) /
      oneMinute
    );


  const s =
    Math.floor(
      (diff % oneMinute) /
      1000
    );


  document
    .getElementById("days")
    .textContent =
    d;


  document
    .getElementById("hours")
    .textContent =
    String(h)
    .padStart(2,"0");


  document
    .getElementById("minutes")
    .textContent =
    String(m)
    .padStart(2,"0");


  document
    .getElementById("seconds")
    .textContent =
    String(s)
    .padStart(2,"0");

}


updateCountdown();

setInterval(
  updateCountdown,
  1000
);


/* ======================================
   START
====================================== */

updateNavigation();

</script>

</body>
</html>
