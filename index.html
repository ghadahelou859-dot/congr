<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Nada Graduation Invitation</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:#dcecf7;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Arial,sans-serif;
}


/* =========================
   BOOK
========================= */

.book{
  position:relative;

  width:100%;
  max-width:480px;
  height:100%;

  overflow:hidden;

  background:#dcecf7;

  perspective:2200px;

  touch-action:none;
}


/* =========================
   PAGE
========================= */

.page{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  overflow:hidden;

  transform-origin:left center;

  transform-style:preserve-3d;

  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;

  transition:
    transform .95s cubic-bezier(.55,.05,.25,1),
    opacity .45s ease;

  background:#dcecf7;
}


/* الصورة تغطي كامل الصفحة */

.page img{
  width:100%;
  height:100%;

  display:block;

  object-fit:cover;

  background:#dcecf7;

  pointer-events:none;

  user-select:none;
  -webkit-user-select:none;
  -webkit-user-drag:none;
}


/* =========================
   STACK
========================= */

.page:nth-of-type(1){z-index:80;}
.page:nth-of-type(2){z-index:70;}
.page:nth-of-type(3){z-index:60;}
.page:nth-of-type(4){z-index:50;}
.page:nth-of-type(5){z-index:40;}
.page:nth-of-type(6){z-index:30;}
.page:nth-of-type(7){z-index:20;}
.page:nth-of-type(8){z-index:10;}


/* =========================
   FLIP
========================= */

.page.flipped{
  transform:rotateY(-178deg);
  pointer-events:none;
}


/* shadow */

.page::after{
  content:"";

  position:absolute;
  inset:0;

  pointer-events:none;

  opacity:0;

  background:
    linear-gradient(
      90deg,
      rgba(0,0,0,.18),
      rgba(0,0,0,.05) 15%,
      transparent 38%
    );

  transition:opacity .45s ease;
}

.page.flipping::after{
  opacity:1;
}


/* =========================
   VIDEO
========================= */

.page-video{
  width:100%;
  height:100%;

  display:block;

  object-fit:cover;

  background:#dcecf7;

  border:0;
  outline:0;

  pointer-events:none;
}


video::-webkit-media-controls{
  display:none !important;
}

video::-webkit-media-controls-enclosure{
  display:none !important;
}

video::-webkit-media-controls-panel{
  display:none !important;
}

video::-webkit-media-controls-play-button{
  display:none !important;
}

video::-webkit-media-controls-start-playback-button{
  display:none !important;
}


/* =========================
   MUSIC
========================= */

.music-btn{
  position:absolute;

  top:14px;
  right:14px;

  z-index:900;

  width:48px;
  height:48px;

  border:none;
  border-radius:50%;

  background:rgba(255,255,255,.92);

  color:#222;

  font-size:21px;

  cursor:pointer;

  box-shadow:
    0 5px 16px rgba(0,0,0,.15);
}


/* =========================
   NEXT / PREVIOUS
========================= */

.nav-arrow{
  position:absolute;

  z-index:850;

  bottom:18px;

  width:48px;
  height:48px;

  border:none;
  border-radius:50%;

  background:rgba(255,255,255,.93);

  color:#222;

  font-size:28px;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  box-shadow:
    0 4px 14px rgba(0,0,0,.12);

  transition:
    opacity .25s ease,
    transform .25s ease;
}


#prevBtn{
  left:16px;
}


#nextBtn{
  right:16px;

  animation:
    nextArrowMove 1.3s ease-in-out infinite;
}


@keyframes nextArrowMove{

  0%,
  100%{
    transform:translateX(0);
  }

  50%{
    transform:translateX(-5px);
  }

}


.nav-arrow.hidden{
  opacity:0;
  pointer-events:none;
}


/* مهم:
   الصفحة الأولى بدون أسهم */

.book.first-page #prevBtn,
.book.first-page #nextBtn{
  opacity:0;
  pointer-events:none;
}


/* =========================
   COUNTDOWN
========================= */

.countdown-overlay{
  position:absolute;
  inset:0;

  z-index:90;

  pointer-events:none;
}


.countdown-number{
  position:absolute;

  display:flex;
  align-items:center;
  justify-content:center;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:
    clamp(30px,9vw,48px);

  color:#202020;

  line-height:1;
}


/* adjust each number separately */

#days{
  top:39%;
  left:22%;
  width:20%;
  height:10%;
}

#hours{
  top:39%;
  right:18%;
  width:20%;
  height:10%;
}

#minutes{
  top:57%;
  left:22%;
  width:20%;
  height:10%;
}

#seconds{
  top:57%;
  right:18%;
  width:20%;
  height:10%;
}


/* =========================
   LOCATION
========================= */

.location-click{
  position:absolute;

  z-index:950;

  left:20%;
  width:62%;

  bottom:9%;
  height:12%;

  display:block;

  background:transparent;
}


/* =========================
   RSVP
========================= */

.rsvp-click{
  position:absolute;

  z-index:950;

  left:18%;
  width:64%;

  top:50%;
  height:14%;

  display:block;

  background:transparent;
}


/* =========================
   DESKTOP
========================= */

@media(min-width:500px){

  .book{
    height:min(100vh,900px);

    border-radius:20px;

    box-shadow:
      0 20px 60px rgba(0,0,0,.18);
  }

}

</style>
</head>

<body>


<div
  class="book first-page"
  id="book"
>


  <!-- PAGE 01 COVER -->
  <section class="page">

    <img
      src="cover.png"
      alt="Nada Graduation Cover"
    >

  </section>


  <!-- PAGE 02 VIDEO -->
  <section class="page">

    <video
      id="nadaVideo"
      class="page-video"

      playsinline
      webkit-playsinline

      preload="auto"

      muted

      disablepictureinpicture

      controlslist="nodownload noplaybackrate nofullscreen"
    >

      <source
        src="video.mp4"
        type="video/mp4"
      >

    </video>

  </section>


  <!-- PAGE 03 SAVE THE TIME -->
  <section class="page">

    <img
      src="savetime.png"
      alt="Save the Time"
    >

  </section>


  <!-- PAGE 04 DATE TIME -->
  <section class="page">

    <img
      src="date-time.png"
      alt="Date and Time"
    >

  </section>


  <!-- PAGE 05 COUNTDOWN -->
  <section class="page">

    <img
      src="countdown.png"
      alt="Countdown"
    >


    <div class="countdown-overlay">

      <div
        class="countdown-number"
        id="days">
      </div>

      <div
        class="countdown-number"
        id="hours">
      </div>

      <div
        class="countdown-number"
        id="minutes">
      </div>

      <div
        class="countdown-number"
        id="seconds">
      </div>

    </div>

  </section>


  <!-- PAGE 06 LOCATION -->
  <section class="page">

    <img
      src="location.png"
      alt="Location"
    >


    <a
      class="location-click"

      href="https://maps.app.goo.gl/1EMywhgSKpQ3VcEL6"

      target="_blank"

      rel="noopener noreferrer"

      aria-label="Open location"
    ></a>

  </section>


  <!-- PAGE 07 DRESS CODE -->
  <section class="page">

    <img
      src="dress-code.png"
      alt="Dress Code"
    >

  </section>


  <!-- PAGE 08 RSVP -->
  <section class="page">

    <img
      src="rsvp.png"
      alt="RSVP"
    >


    <a
      class="rsvp-click"

      href="https://wa.me/970598494977?text=%D9%85%D8%B1%D8%AD%D8%A8%D8%A7%D9%8B%D8%8C%20%D8%A3%D8%A4%D9%83%D8%AF%20%D8%AD%D8%B6%D9%88%D8%B1%D9%8A%20%D9%84%D8%AD%D9%81%D9%84%20%D8%AA%D8%AE%D8%B1%D8%AC%20%D9%86%D8%AF%D9%89%20%F0%9F%8E%93%E2%9C%A8"

      target="_blank"

      rel="noopener noreferrer"

      aria-label="Confirm attendance"
    ></a>

  </section>


  <!-- MUSIC -->

  <audio
    id="bgMusic"
    loop
    preload="auto"
  >

    <source
      src="music.mp3"
      type="audio/mpeg"
    >

  </audio>


  <button
    id="musicBtn"
    class="music-btn"
    type="button"
    aria-label="Music"
  >
    ♪
  </button>


  <!-- PREVIOUS -->

  <button
    id="prevBtn"
    class="nav-arrow hidden"
    type="button"
    aria-label="Previous page"
  >
    ‹
  </button>


  <!-- NEXT -->

  <button
    id="nextBtn"
    class="nav-arrow hidden"
    type="button"
    aria-label="Next page"
  >
    ›
  </button>


</div>


<script>

/* =========================
   VARIABLES
========================= */

const book =
  document.getElementById("book");

const pages =
  [...document.querySelectorAll(".page")];

const nextBtn =
  document.getElementById("nextBtn");

const prevBtn =
  document.getElementById("prevBtn");

const nadaVideo =
  document.getElementById("nadaVideo");

const bgMusic =
  document.getElementById("bgMusic");

const musicBtn =
  document.getElementById("musicBtn");


let currentPage = 0;

let animating = false;

let musicPlaying = false;


/* =========================
   NAVIGATION
========================= */

function updateNavigation(){

  /*
  first page:
  no arrows
  */

  if(currentPage === 0){

    book.classList.add(
      "first-page"
    );

    prevBtn.classList.add(
      "hidden"
    );

    nextBtn.classList.add(
      "hidden"
    );

    return;

  }


  book.classList.remove(
    "first-page"
  );


  /*
  previous
  */

  if(currentPage > 0){

    prevBtn.classList.remove(
      "hidden"
    );

  }


  /*
  last page
  */

  if(
    currentPage ===
    pages.length - 1
  ){

    nextBtn.classList.add(
      "hidden"
    );

  }

  else{

    nextBtn.classList.remove(
      "hidden"
    );

  }

}


/* =========================
   NEXT
========================= */

function nextPage(){

  if(animating){
    return;
  }


  if(
    currentPage >=
    pages.length - 1
  ){
    return;
  }


  animating = true;


  const page =
    pages[currentPage];


  page.classList.add(
    "flipping"
  );


  requestAnimationFrame(
    ()=>{

      page.classList.add(
        "flipped"
      );

    }
  );


  setTimeout(
    ()=>{

      page.classList.remove(
        "flipping"
      );


      currentPage++;


      updateNavigation();


      handleVideo();


      animating = false;

    },
    950
  );

}


/* =========================
   PREVIOUS
========================= */

function previousPage(){

  if(animating){
    return;
  }


  if(currentPage <= 0){
    return;
  }


  animating = true;


  const previous =
    pages[
      currentPage - 1
    ];


  previous.classList.add(
    "flipping"
  );


  previous.classList.remove(
    "flipped"
  );


  setTimeout(
    ()=>{

      previous.classList.remove(
        "flipping"
      );


      currentPage--;


      updateNavigation();


      handleVideo();


      animating = false;

    },
    950
  );

}


/* =========================
   BUTTONS
========================= */

nextBtn.addEventListener(
  "click",
  nextPage
);


prevBtn.addEventListener(
  "click",
  previousPage
);


/* =========================
   SWIPE
========================= */

let startX = 0;
let startY = 0;


book.addEventListener(
  "touchstart",
  event=>{

    const touch =
      event.touches[0];


    startX =
      touch.clientX;


    startY =
      touch.clientY;


    startMusic();

  },
  {
    passive:true
  }
);


book.addEventListener(
  "touchend",
  event=>{

    const touch =
      event.changedTouches[0];


    const dx =
      touch.clientX -
      startX;


    const dy =
      touch.clientY -
      startY;


    if(
      Math.abs(dx) < 45
    ){
      return;
    }


    if(
      Math.abs(dx) <
      Math.abs(dy)
    ){
      return;
    }


    if(dx < 0){

      nextPage();

    }

    else{

      previousPage();

    }

  },
  {
    passive:true
  }
);


/* =========================
   DESKTOP DRAG
========================= */

let pointerStartX = 0;
let dragging = false;


book.addEventListener(
  "pointerdown",
  event=>{

    if(
      event.target.closest("a") ||
      event.target.closest("button")
    ){
      return;
    }


    startMusic();


    pointerStartX =
      event.clientX;


    dragging = true;

  }
);


book.addEventListener(
  "pointerup",
  event=>{

    if(!dragging){
      return;
    }


    dragging = false;


    const dx =
      event.clientX -
      pointerStartX;


    if(
      Math.abs(dx) < 55
    ){
      return;
    }


    if(dx < 0){

      nextPage();

    }

    else{

      previousPage();

    }

  }
);


/* =========================
   VIDEO
========================= */

function handleVideo(){

  if(currentPage === 1){

    nadaVideo.currentTime = 0;


    nadaVideo
    .play()
    .catch(()=>{});

  }

  else{

    nadaVideo.pause();

  }

}


/* after video */

nadaVideo.addEventListener(
  "ended",
  ()=>{

    if(currentPage === 1){

      setTimeout(
        nextPage,
        300
      );

    }

  }
);


/* =========================
   MUSIC
========================= */

async function startMusic(){

  if(musicPlaying){
    return;
  }


  try{

    bgMusic.volume = 0.42;


    await bgMusic.play();


    musicPlaying = true;


    musicBtn.textContent =
      "♫";

  }

  catch(error){}

}


/* button */

musicBtn.addEventListener(
  "click",
  async event=>{

    event.stopPropagation();


    /*
    stop
    */

    if(musicPlaying){

      bgMusic.pause();


      musicPlaying =
        false;


      musicBtn.textContent =
        "♪";


      return;

    }


    /*
    play again
    */

    try{

      bgMusic.volume =
        0.42;


      await bgMusic.play();


      musicPlaying =
        true;


      musicBtn.textContent =
        "♫";

    }

    catch(error){}

  }
);


/* =========================
   COUNTDOWN
========================= */

const eventDate =
  new Date(
    "2027-07-27T19:00:00+03:00"
  );


function updateCountdown(){

  let diff =
    eventDate.getTime() -
    Date.now();


  if(diff < 0){

    diff = 0;

  }


  const day =
    1000 * 60 * 60 * 24;


  const hour =
    1000 * 60 * 60;


  const minute =
    1000 * 60;


  const days =
    Math.floor(
      diff / day
    );


  const hours =
    Math.floor(
      (diff % day) /
      hour
    );


  const minutes =
    Math.floor(
      (diff % hour) /
      minute
    );


  const seconds =
    Math.floor(
      (diff % minute) /
      1000
    );


  document
  .getElementById("days")
  .textContent =
    days;


  document
  .getElementById("hours")
  .textContent =
    String(hours)
    .padStart(2,"0");


  document
  .getElementById("minutes")
  .textContent =
    String(minutes)
    .padStart(2,"0");


  document
  .getElementById("seconds")
  .textContent =
    String(seconds)
    .padStart(2,"0");

}


updateCountdown();


setInterval(
  updateCountdown,
  1000
);


/* =========================
   START
========================= */

updateNavigation();

</script>

</body>
</html>
