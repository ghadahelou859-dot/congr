<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<title>Nada Graduation Invitation</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#dcecf7;
}

body{
  font-family:Arial, sans-serif;
}

/* =========================
   BOOK
========================= */

.book{
  position:relative;

  width:100vw;
  height:100vh;
  height:100dvh;

  overflow:hidden;

  background:#dcecf7;

  perspective:2200px;

  touch-action:none;
}

/* =========================
   PAGE
========================= */

.page{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  overflow:hidden;

  background:#dcecf7;

  transform-origin:left center;

  transform-style:preserve-3d;

  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;

  transition:
    transform .9s cubic-bezier(.55,.05,.25,1);

  will-change:transform;
}

/* =========================
   الصور تغطي الشاشة كاملة
========================= */

.page > img{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  display:block;

  object-fit:cover;
  object-position:center center;

  pointer-events:none;

  user-select:none;
  -webkit-user-select:none;
  -webkit-user-drag:none;
}

/* =========================
   PAGE ORDER
========================= */

.page:nth-of-type(1){z-index:80;}
.page:nth-of-type(2){z-index:70;}
.page:nth-of-type(3){z-index:60;}
.page:nth-of-type(4){z-index:50;}
.page:nth-of-type(5){z-index:40;}
.page:nth-of-type(6){z-index:30;}
.page:nth-of-type(7){z-index:20;}
.page:nth-of-type(8){z-index:10;}

/* =========================
   FLIP
========================= */

.page.flipped{
  transform:rotateY(-180deg);
  pointer-events:none;
}

.page::after{
  content:"";

  position:absolute;
  inset:0;

  pointer-events:none;

  opacity:0;

  background:
    linear-gradient(
      90deg,
      rgba(0,0,0,.18),
      rgba(0,0,0,.05) 15%,
      transparent 40%
    );

  transition:opacity .4s ease;
}

.page.flipping::after{
  opacity:1;
}

/* =========================
   VIDEO FULL SCREEN
========================= */

.page-video{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  display:block;

  object-fit:cover;
  object-position:center center;

  background:#dcecf7;

  border:0;
  outline:0;

  pointer-events:none;
}

video::-webkit-media-controls,
video::-webkit-media-controls-enclosure,
video::-webkit-media-controls-panel,
video::-webkit-media-controls-play-button,
video::-webkit-media-controls-start-playback-button{
  display:none !important;
}

/* =========================
   MUSIC
========================= */

.music-btn{
  position:absolute;

  top:calc(14px + env(safe-area-inset-top));
  right:calc(14px + env(safe-area-inset-right));

  z-index:1000;

  width:46px;
  height:46px;

  border:0;
  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(255,255,255,.94);

  color:#111;

  font-size:20px;

  box-shadow:0 5px 16px rgba(0,0,0,.14);
}

/* =========================
   NAVIGATION
========================= */

.nav-arrow{
  position:absolute;

  bottom:calc(18px + env(safe-area-inset-bottom));

  z-index:900;

  width:46px;
  height:46px;

  border:0;
  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(255,255,255,.94);

  color:#222;

  font-size:28px;

  box-shadow:0 4px 14px rgba(0,0,0,.14);
}

#prevBtn{
  left:14px;
}

#nextBtn{
  right:14px;
}

.nav-arrow.hidden{
  opacity:0;
  pointer-events:none;
}

.book.first-page .nav-arrow{
  opacity:0;
  pointer-events:none;
}

/* =========================
   COUNTDOWN
========================= */

.countdown-overlay{
  position:absolute;
  inset:0;

  z-index:100;

  pointer-events:none;
}

.countdown-number{
  position:absolute;

  transform:translate(-50%,-50%);

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  font-family:Georgia, serif;

  font-size:clamp(30px,9vw,48px);

  color:#202020;
}

/* وسط المربعات */

#days{
  left:29%;
  top:48%;
}

#hours{
  left:69%;
  top:48%;
}

#minutes{
  left:29%;
  top:69%;
}

#seconds{
  left:69%;
  top:69%;
}

/* =========================
   LOCATION
========================= */

.location-click{
  position:absolute;

  z-index:500;

  left:18%;
  width:64%;

  bottom:8%;
  height:13%;

  display:block;
}

/* =========================
   RSVP
========================= */

.rsvp-click{
  position:absolute;

  z-index:500;

  left:18%;
  width:64%;

  top:56%;
  height:12%;

  display:block;
}
</style>
</head>

<body>

<div class="book first-page" id="book">

  <!-- PAGE 01 -->
  <section class="page">
    <img src="cover.png" alt="Cover">
  </section>

  <!-- PAGE 02 VIDEO -->
  <section class="page">
    <video
      id="nadaVideo"
      class="page-video"
      playsinline
      webkit-playsinline
      preload="metadata"
      muted
      disablepictureinpicture
      controlslist="nodownload noplaybackrate nofullscreen"
    >
      <source src="video.mp4" type="video/mp4">
    </video>
  </section>

  <!-- PAGE 03 -->
  <section class="page">
    <img src="savetime.png" alt="Save the Time">
  </section>

  <!-- PAGE 04 -->
  <section class="page">
    <img src="date-time.png" alt="Date and Time">
  </section>

  <!-- PAGE 05 COUNTDOWN -->
  <section class="page">
    <img src="countdown.png" alt="Countdown">

    <div class="countdown-overlay">
      <div id="days" class="countdown-number"></div>
      <div id="hours" class="countdown-number"></div>
      <div id="minutes" class="countdown-number"></div>
      <div id="seconds" class="countdown-number"></div>
    </div>
  </section>

  <!-- PAGE 06 LOCATION -->
  <section class="page">
    <img src="location.png" alt="Location">

    <a
      class="location-click"
      href="https://maps.app.goo.gl/1EMywhgSKpQ3VcEL6"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Open Location"
    ></a>
  </section>

  <!-- PAGE 07 -->
  <section class="page">
    <img src="dress-code.png" alt="Dress Code">
  </section>

  <!-- PAGE 08 RSVP -->
  <section class="page">
    <img src="rsvp.png" alt="Confirm Attendance">

    <a
      class="rsvp-click"
      href="https://wa.me/970598494977?text=%D9%85%D8%B1%D8%AD%D8%A8%D8%A7%D9%8B%D8%8C%20%D8%A3%D8%A4%D9%83%D8%AF%20%D8%AD%D8%B6%D9%88%D8%B1%D9%8A%20%D9%84%D8%AD%D9%81%D9%84%20%D8%AA%D8%AE%D8%B1%D8%AC%20%D9%86%D8%AF%D9%89%20%F0%9F%8E%93%E2%9C%A8"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Confirm Attendance"
    ></a>
  </section>

  <!-- MUSIC -->
  <audio id="bgMusic" loop preload="auto">
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <button id="musicBtn" class="music-btn" type="button">♪</button>

  <button id="prevBtn" class="nav-arrow hidden" type="button">‹</button>
  <button id="nextBtn" class="nav-arrow hidden" type="button">›</button>

</div>

<script>
const book = document.getElementById("book");
const pages = [...document.querySelectorAll(".page")];

const nextBtn = document.getElementById("nextBtn");
const prevBtn = document.getElementById("prevBtn");

const nadaVideo = document.getElementById("nadaVideo");

const bgMusic = document.getElementById("bgMusic");
const musicBtn = document.getElementById("musicBtn");

let currentPage = 0;
let animating = false;

let musicPlaying = false;
let musicManuallyStopped = false;

/* =========================
   NAVIGATION
========================= */

function updateNavigation(){

  if(currentPage === 0){

    book.classList.add("first-page");

    prevBtn.classList.add("hidden");
    nextBtn.classList.add("hidden");

  }else{

    book.classList.remove("first-page");

    prevBtn.classList.remove("hidden");

    if(currentPage === pages.length - 1){
      nextBtn.classList.add("hidden");
    }else{
      nextBtn.classList.remove("hidden");
    }

  }

}

/* =========================
   NEXT
========================= */

function nextPage(){

  if(animating) return;

  if(currentPage >= pages.length - 1) return;

  animating = true;

  const current = pages[currentPage];

  current.classList.add("flipping");

  requestAnimationFrame(()=>{
    current.classList.add("flipped");
  });

  setTimeout(()=>{

    current.classList.remove("flipping");

    currentPage++;

    updateNavigation();

    handleVideo();

    animating = false;

  },900);

}

/* =========================
   PREVIOUS
========================= */

function previousPage(){

  if(animating) return;

  if(currentPage <= 0) return;

  animating = true;

  const previous = pages[currentPage - 1];

  previous.classList.add("flipping");

  previous.classList.remove("flipped");

  setTimeout(()=>{

    previous.classList.remove("flipping");

    currentPage--;

    updateNavigation();

    handleVideo();

    animating = false;

  },900);

}

/* =========================
   BUTTONS
========================= */

nextBtn.addEventListener("click", ()=>{

  tryStartMusic();

  nextPage();

});

prevBtn.addEventListener("click", previousPage);

/* =========================
   SWIPE
========================= */

let startX = 0;
let startY = 0;

book.addEventListener("touchstart", event=>{

  if(
    event.target.closest("a") ||
    event.target.closest("button")
  ){
    return;
  }

  const touch = event.touches[0];

  startX = touch.clientX;
  startY = touch.clientY;

  tryStartMusic();

},{passive:true});

book.addEventListener("touchend", event=>{

  if(
    event.target.closest("a") ||
    event.target.closest("button")
  ){
    return;
  }

  const touch = event.changedTouches[0];

  const dx = touch.clientX - startX;
  const dy = touch.clientY - startY;

  if(Math.abs(dx) < 45) return;

  if(Math.abs(dx) < Math.abs(dy)) return;

  if(dx < 0){
    nextPage();
  }else{
    previousPage();
  }

},{passive:true});

/* =========================
   VIDEO
========================= */

function handleVideo(){

  if(currentPage === 1){

    nadaVideo.currentTime = 0;

    nadaVideo.play().catch(()=>{});

  }else{

    nadaVideo.pause();

    nadaVideo.currentTime = 0;

  }

}

/* بعد انتهاء الفيديو
   ينتقل تلقائياً */

nadaVideo.addEventListener("ended", ()=>{

  if(currentPage !== 1) return;

  setTimeout(()=>{
    nextPage();
  },150);

});

/* =========================
   MUSIC
========================= */

async function tryStartMusic(){

  if(musicManuallyStopped) return;

  if(musicPlaying) return;

  try{

    bgMusic.volume = 0.42;

    await bgMusic.play();

    musicPlaying = true;

    musicBtn.textContent = "♫";

  }catch(error){}

}

musicBtn.addEventListener("click", async event=>{

  event.stopPropagation();

  if(musicPlaying){

    bgMusic.pause();

    musicPlaying = false;

    musicManuallyStopped = true;

    musicBtn.textContent = "♪";

    return;
  }

  try{

    musicManuallyStopped = false;

    bgMusic.volume = 0.42;

    await bgMusic.play();

    musicPlaying = true;

    musicBtn.textContent = "♫";

  }catch(error){}

});

/* =========================
   COUNTDOWN
========================= */

const eventDate =
  new Date("2027-07-27T19:00:00+03:00");

function updateCountdown(){

  let diff =
    eventDate.getTime() -
    Date.now();

  if(diff < 0){
    diff = 0;
  }

  const day =
    1000 * 60 * 60 * 24;

  const hour =
    1000 * 60 * 60;

  const minute =
    1000 * 60;

  const d =
    Math.floor(diff / day);

  const h =
    Math.floor(
      (diff % day) / hour
    );

  const m =
    Math.floor(
      (diff % hour) / minute
    );

  const s =
    Math.floor(
      (diff % minute) / 1000
    );

  document.getElementById("days").textContent = d;

  document.getElementById("hours").textContent =
    String(h).padStart(2,"0");

  document.getElementById("minutes").textContent =
    String(m).padStart(2,"0");

  document.getElementById("seconds").textContent =
    String(s).padStart(2,"0");

}

updateCountdown();

setInterval(updateCountdown,1000);

updateNavigation();
</script>

</body>
</html>
