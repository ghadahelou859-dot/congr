<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<title>Nada Graduation Invitation</title>

<style>

/* =========================
   RESET
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#dcecf7;
}

body{
  font-family:Arial, sans-serif;
}


/* =========================
   MOBILE BOOK
========================= */

.book{
  position:relative;

  width:100vw;
  height:100vh;
  height:100dvh;

  overflow:hidden;

  background:#dcecf7;

  perspective:2200px;

  touch-action:none;
}


/* =========================
   PAGE
========================= */

.page{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  overflow:hidden;

  background:#dcecf7;

  transform-origin:left center;

  transform-style:preserve-3d;

  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;

  transition:
    transform .9s cubic-bezier(.55,.05,.25,1);

  will-change:transform;
}


/* =========================
   PAGE IMAGE
   الصورة كاملة بدون قص
========================= */

.page > img{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  display:block;

  object-fit:contain;
  object-position:center center;

  background:#dcecf7;

  pointer-events:none;

  user-select:none;
  -webkit-user-select:none;
  -webkit-user-drag:none;
}


/* =========================
   PAGE ORDER
========================= */

.page:nth-of-type(1){z-index:80;}
.page:nth-of-type(2){z-index:70;}
.page:nth-of-type(3){z-index:60;}
.page:nth-of-type(4){z-index:50;}
.page:nth-of-type(5){z-index:40;}
.page:nth-of-type(6){z-index:30;}
.page:nth-of-type(7){z-index:20;}
.page:nth-of-type(8){z-index:10;}


/* =========================
   PAGE FLIP
========================= */

.page.flipped{
  transform:rotateY(-180deg);
  pointer-events:none;
}


/* ظل أثناء التقليب */

.page::after{
  content:"";

  position:absolute;
  inset:0;

  pointer-events:none;

  opacity:0;

  background:
    linear-gradient(
      90deg,
      rgba(0,0,0,.18),
      rgba(0,0,0,.05) 16%,
      transparent 40%
    );

  transition:opacity .4s ease;
}


.page.flipping::after{
  opacity:1;
}


/* =========================
   VIDEO
========================= */

.page-video{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  display:block;

  object-fit:contain;
  object-position:center center;

  background:#dcecf7;

  border:0;
  outline:0;

  pointer-events:none;
}


/* اخفاء شريط الفيديو */

video::-webkit-media-controls{
  display:none !important;
}

video::-webkit-media-controls-enclosure{
  display:none !important;
}

video::-webkit-media-controls-panel{
  display:none !important;
}

video::-webkit-media-controls-play-button{
  display:none !important;
}

video::-webkit-media-controls-start-playback-button{
  display:none !important;
}


/* =========================
   MUSIC BUTTON
========================= */

.music-btn{
  position:absolute;

  top:calc(14px + env(safe-area-inset-top));
  right:calc(14px + env(safe-area-inset-right));

  z-index:1000;

  width:46px;
  height:46px;

  border:0;
  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(255,255,255,.94);

  color:#111;

  font-size:20px;

  cursor:pointer;

  box-shadow:
    0 5px 16px rgba(0,0,0,.14);
}


/* =========================
   NAV ARROWS
========================= */

.nav-arrow{
  position:absolute;

  bottom:calc(18px + env(safe-area-inset-bottom));

  z-index:900;

  width:46px;
  height:46px;

  border:0;
  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(255,255,255,.94);

  color:#222;

  font-size:28px;

  cursor:pointer;

  box-shadow:
    0 4px 14px rgba(0,0,0,.14);

  transition:opacity .25s ease;
}


#prevBtn{
  left:14px;
}


#nextBtn{
  right:14px;

  animation:
    nextMove 1.3s ease-in-out infinite;
}


@keyframes nextMove{

  0%,
  100%{
    transform:translateX(0);
  }

  50%{
    transform:translateX(-5px);
  }

}


.nav-arrow.hidden{
  opacity:0;
  pointer-events:none;
}


/* أول صفحة بدون أسهم */

.book.first-page .nav-arrow{
  opacity:0;
  pointer-events:none;
}


/* =========================
   SWIPE LABEL
========================= */

.swipe-label{
  position:absolute;

  left:50%;
  bottom:calc(25px + env(safe-area-inset-bottom));

  transform:translateX(-50%);

  z-index:850;

  padding:6px 12px;

  border-radius:20px;

  background:rgba(255,255,255,.88);

  color:#555;

  font-size:11px;

  white-space:nowrap;

  pointer-events:none;
}


.book.first-page .swipe-label{
  display:none;
}


/* =========================
   COUNTDOWN
========================= */

.countdown-overlay{
  position:absolute;
  inset:0;

  z-index:100;

  pointer-events:none;
}


.countdown-number{
  position:absolute;

  transform:translate(-50%,-50%);

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  min-width:18%;
  min-height:8%;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:clamp(30px,9vw,48px);

  font-weight:500;

  color:#202020;

  line-height:1;
}


/* وسط المربع العلوي اليسار */

#days{
  left:29%;
  top:48%;
}


/* وسط المربع العلوي اليمين */

#hours{
  left:69%;
  top:48%;
}


/* وسط المربع السفلي اليسار */

#minutes{
  left:29%;
  top:69%;
}


/* وسط المربع السفلي اليمين */

#seconds{
  left:69%;
  top:69%;
}


/* =========================
   LOCATION LINK
========================= */

.location-click{
  position:absolute;

  z-index:500;

  left:18%;
  width:64%;

  bottom:8%;
  height:13%;

  display:block;

  background:transparent;
}


/* =========================
   RSVP LINK
========================= */

.rsvp-click{
  position:absolute;

  z-index:500;

  left:18%;
  width:64%;

  top:56%;
  height:12%;

  display:block;

  background:transparent;
}


/* =========================
   SMALL PHONES
========================= */

@media(max-width:380px){

  .music-btn,
  .nav-arrow{
    width:42px;
    height:42px;
  }

  .countdown-number{
    font-size:clamp(26px,8vw,42px);
  }

}

</style>
</head>


<body>

<div
  class="book first-page"
  id="book"
>


<!-- =========================
     PAGE 01 COVER
========================= -->

<section class="page">

  <img
    src="cover.png"
    alt="Nada Graduation Cover"
  >

</section>


<!-- =========================
     PAGE 02 VIDEO
========================= -->

<section class="page">

  <video
    id="nadaVideo"
    class="page-video"

    playsinline
    webkit-playsinline

    preload="auto"

    muted

    disablepictureinpicture

    controlslist="nodownload noplaybackrate nofullscreen"
  >

    <source
      src="video.mp4"
      type="video/mp4"
    >

  </video>

</section>


<!-- =========================
     PAGE 03 SAVE THE TIME
========================= -->

<section class="page">

  <img
    src="savetime.png"
    alt="Save the Time"
  >

</section>


<!-- =========================
     PAGE 04 DATE TIME
========================= -->

<section class="page">

  <img
    src="date-time.png"
    alt="Date and Time"
  >

</section>


<!-- =========================
     PAGE 05 COUNTDOWN
========================= -->

<section class="page">

  <img
    src="countdown.png"
    alt="Countdown"
  >


  <div class="countdown-overlay">

    <div
      id="days"
      class="countdown-number">
    </div>

    <div
      id="hours"
      class="countdown-number">
    </div>

    <div
      id="minutes"
      class="countdown-number">
    </div>

    <div
      id="seconds"
      class="countdown-number">
    </div>

  </div>

</section>


<!-- =========================
     PAGE 06 LOCATION
========================= -->

<section class="page">

  <img
    src="location.png"
    alt="Jasmine Hall Hebron"
  >


  <a
    class="location-click"

    href="https://maps.app.goo.gl/1EMywhgSKpQ3VcEL6"

    target="_blank"

    rel="noopener noreferrer"

    aria-label="Open Location"
  ></a>

</section>


<!-- =========================
     PAGE 07 DRESS CODE
========================= -->

<section class="page">

  <img
    src="dress-code.png"
    alt="Dress Code"
  >

</section>


<!-- =========================
     PAGE 08 RSVP
========================= -->

<section class="page">

  <img
    src="rsvp.png"
    alt="Confirm Attendance"
  >


  <a
    class="rsvp-click"

    href="https://wa.me/970598494977?text=%D9%85%D8%B1%D8%AD%D8%A8%D8%A7%D9%8B%D8%8C%20%D8%A3%D8%A4%D9%83%D8%AF%20%D8%AD%D8%B6%D9%88%D8%B1%D9%8A%20%D9%84%D8%AD%D9%81%D9%84%20%D8%AA%D8%AE%D8%B1%D8%AC%20%D9%86%D8%AF%D9%89%20%F0%9F%8E%93%E2%9C%A8"

    target="_blank"

    rel="noopener noreferrer"

    aria-label="Confirm Attendance"
  ></a>

</section>


<!-- =========================
     MUSIC
========================= -->

<audio
  id="bgMusic"
  loop
  preload="auto"
>

  <source
    src="music.mp3"
    type="audio/mpeg"
  >

</audio>


<button
  id="musicBtn"
  class="music-btn"
  type="button"
  aria-label="Music"
>
♪
</button>


<!-- =========================
     PREVIOUS
========================= -->

<button
  id="prevBtn"
  class="nav-arrow hidden"
  type="button"
  aria-label="Previous Page"
>
‹
</button>


<!-- =========================
     SWIPE
========================= -->

<div
  id="swipeLabel"
  class="swipe-label"
>
اسحبي الصفحة
</div>


<!-- =========================
     NEXT
========================= -->

<button
  id="nextBtn"
  class="nav-arrow hidden"
  type="button"
  aria-label="Next Page"
>
›
</button>


</div>


<script>

/* =========================
   VARIABLES
========================= */

const book =
  document.getElementById("book");


const pages =
  [...document.querySelectorAll(".page")];


const nextBtn =
  document.getElementById("nextBtn");


const prevBtn =
  document.getElementById("prevBtn");


const swipeLabel =
  document.getElementById("swipeLabel");


const nadaVideo =
  document.getElementById("nadaVideo");


const bgMusic =
  document.getElementById("bgMusic");


const musicBtn =
  document.getElementById("musicBtn");


let currentPage = 0;

let animating = false;

let musicPlaying = false;

let musicManuallyStopped = false;


/* =========================
   NAVIGATION
========================= */

function updateNavigation(){

  if(currentPage === 0){

    book.classList.add(
      "first-page"
    );


    prevBtn.classList.add(
      "hidden"
    );


    nextBtn.classList.add(
      "hidden"
    );


    return;

  }


  book.classList.remove(
    "first-page"
  );


  if(currentPage > 0){

    prevBtn.classList.remove(
      "hidden"
    );

  }

  else{

    prevBtn.classList.add(
      "hidden"
    );

  }


  if(
    currentPage ===
    pages.length - 1
  ){

    nextBtn.classList.add(
      "hidden"
    );


    swipeLabel.textContent =
      "الصفحة الأخيرة";

  }

  else{

    nextBtn.classList.remove(
      "hidden"
    );


    swipeLabel.textContent =
      "اسحبي الصفحة";

  }

}


/* =========================
   NEXT PAGE
========================= */

function nextPage(){

  if(animating){
    return;
  }


  if(
    currentPage >=
    pages.length - 1
  ){
    return;
  }


  animating = true;


  const current =
    pages[currentPage];


  current.classList.add(
    "flipping"
  );


  requestAnimationFrame(
    ()=>{

      current.classList.add(
        "flipped"
      );

    }
  );


  setTimeout(
    ()=>{

      current.classList.remove(
        "flipping"
      );


      currentPage++;


      updateNavigation();


      handleVideo();


      animating = false;

    },
    900
  );

}


/* =========================
   PREVIOUS PAGE
========================= */

function previousPage(){

  if(animating){
    return;
  }


  if(currentPage <= 0){
    return;
  }


  animating = true;


  const previous =
    pages[
      currentPage - 1
    ];


  previous.classList.add(
    "flipping"
  );


  previous.classList.remove(
    "flipped"
  );


  setTimeout(
    ()=>{

      previous.classList.remove(
        "flipping"
      );


      currentPage--;


      updateNavigation();


      handleVideo();


      animating = false;

    },
    900
  );

}


/* =========================
   NAV BUTTONS
========================= */

nextBtn.addEventListener(
  "click",
  ()=>{

    tryStartMusic();

    nextPage();

  }
);


prevBtn.addEventListener(
  "click",
  previousPage
);


/* =========================
   TOUCH SWIPE
========================= */

let startX = 0;
let startY = 0;


book.addEventListener(
  "touchstart",
  event=>{

    if(
      event.target.closest("a") ||
      event.target.closest("button")
    ){
      return;
    }


    const touch =
      event.touches[0];


    startX =
      touch.clientX;


    startY =
      touch.clientY;


    tryStartMusic();

  },
  {
    passive:true
  }
);


book.addEventListener(
  "touchend",
  event=>{

    if(
      event.target.closest("a") ||
      event.target.closest("button")
    ){
      return;
    }


    const touch =
      event.changedTouches[0];


    const dx =
      touch.clientX -
      startX;


    const dy =
      touch.clientY -
      startY;


    if(
      Math.abs(dx) < 45
    ){
      return;
    }


    if(
      Math.abs(dx) <
      Math.abs(dy)
    ){
      return;
    }


    if(dx < 0){

      nextPage();

    }

    else{

      previousPage();

    }

  },
  {
    passive:true
  }
);


/* =========================
   VIDEO
========================= */

function handleVideo(){

  if(currentPage === 1){

    nadaVideo.currentTime = 0;


    nadaVideo
    .play()
    .catch(()=>{});

  }

  else{

    nadaVideo.pause();

  }

}


/* بعد انتهاء الفيديو
   ينتقل تلقائياً */

nadaVideo.addEventListener(
  "ended",
  ()=>{

    if(currentPage !== 1){
      return;
    }


    setTimeout(
      ()=>{

        nextPage();

      },
      150
    );

  }
);


/* =========================
   MUSIC
========================= */

async function tryStartMusic(){

  if(musicManuallyStopped){
    return;
  }


  if(musicPlaying){
    return;
  }


  try{

    bgMusic.volume =
      0.42;


    await bgMusic.play();


    musicPlaying = true;


    musicBtn.textContent =
      "♫";

  }

  catch(error){}

}


musicBtn.addEventListener(
  "click",
  async event=>{

    event.stopPropagation();


    if(musicPlaying){

      bgMusic.pause();


      musicPlaying =
        false;


      musicManuallyStopped =
        true;


      musicBtn.textContent =
        "♪";


      return;

    }


    try{

      musicManuallyStopped =
        false;


      bgMusic.volume =
        0.42;


      await bgMusic.play();


      musicPlaying =
        true;


      musicBtn.textContent =
        "♫";

    }

    catch(error){}

  }
);


/* =========================
   COUNTDOWN
========================= */

const eventDate =
  new Date(
    "2027-07-27T19:00:00+03:00"
  );


function updateCountdown(){

  let difference =
    eventDate.getTime() -
    Date.now();


  if(difference < 0){

    difference = 0;

  }


  const oneDay =
    1000 * 60 * 60 * 24;


  const oneHour =
    1000 * 60 * 60;


  const oneMinute =
    1000 * 60;


  const days =
    Math.floor(
      difference /
      oneDay
    );


  const hours =
    Math.floor(
      (difference % oneDay) /
      oneHour
    );


  const minutes =
    Math.floor(
      (difference % oneHour) /
      oneMinute
    );


  const seconds =
    Math.floor(
      (difference % oneMinute) /
      1000
    );


  document
  .getElementById("days")
  .textContent =
    days;


  document
  .getElementById("hours")
  .textContent =
    String(hours)
    .padStart(
      2,
      "0"
    );


  document
  .getElementById("minutes")
  .textContent =
    String(minutes)
    .padStart(
      2,
      "0"
    );


  document
  .getElementById("seconds")
  .textContent =
    String(seconds)
    .padStart(
      2,
      "0"
    );

}


updateCountdown();


setInterval(
  updateCountdown,
  1000
);


/* =========================
   INITIALIZE
========================= */

updateNavigation();

</script>

</body>
</html>
