<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Nada Graduation Invitation</title>

<style>

/* =====================================
   RESET
===================================== */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:#dcecf7;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Arial,sans-serif;
}


/* =====================================
   9:16 WRAPPER
===================================== */

.book-wrapper{
  width:min(
    100vw,
    calc(100vh * 9 / 16)
  );

  height:min(
    100vh,
    calc(100vw * 16 / 9)
  );

  display:flex;
  align-items:center;
  justify-content:center;
}


/* =====================================
   BOOK
===================================== */

.book{
  position:relative;

  width:100%;
  height:100%;

  overflow:hidden;

  background:#f7f3e9;

  perspective:2400px;

  touch-action:none;
}


/* =====================================
   PAGE
===================================== */

.page{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  overflow:hidden;

  background:#f7f3e9;

  transform-origin:5% 50%;

  transform-style:preserve-3d;

  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;

  transition:
    transform 1s cubic-bezier(.55,.05,.25,1),
    filter .8s ease;

  will-change:transform;
}


/* =====================================
   PAGE IMAGE
===================================== */

.page img{
  width:100%;
  height:100%;

  display:block;

  object-fit:contain;

  background:#f7f3e9;

  pointer-events:none;

  user-select:none;
  -webkit-user-select:none;
  -webkit-user-drag:none;
}


/* =====================================
   STACK ORDER
===================================== */

.page:nth-of-type(1){z-index:80;}
.page:nth-of-type(2){z-index:70;}
.page:nth-of-type(3){z-index:60;}
.page:nth-of-type(4){z-index:50;}
.page:nth-of-type(5){z-index:40;}
.page:nth-of-type(6){z-index:30;}
.page:nth-of-type(7){z-index:20;}
.page:nth-of-type(8){z-index:10;}


/* =====================================
   PAGE FLIP
===================================== */

.page.flipped{
  transform:rotateY(-178deg);
  pointer-events:none;
}


/* =====================================
   PAGE SHADOW
===================================== */

.page::before{
  content:"";

  position:absolute;
  inset:0;

  z-index:5;

  pointer-events:none;

  opacity:0;

  background:
    linear-gradient(
      90deg,
      rgba(0,0,0,.18),
      rgba(0,0,0,.05) 16%,
      transparent 40%
    );

  transition:opacity .55s ease;
}

.page.flipping::before{
  opacity:1;
}


/* =====================================
   NOTEBOOK SPIRAL
===================================== */

.spiral{
  position:absolute;

  z-index:500;

  left:3px;
  top:2%;

  width:34px;
  height:96%;

  pointer-events:none;
}


/* center gold wire */

.spiral::before{
  content:"";

  position:absolute;

  left:16px;
  top:0;

  width:3px;
  height:100%;

  border-radius:4px;

  background:
    linear-gradient(
      90deg,
      #77531e,
      #e4bf61,
      #926b28
    );

  box-shadow:
    1px 0 2px rgba(0,0,0,.20);
}


/* spiral rings */

.spiral::after{
  content:"";

  position:absolute;
  inset:0;

  background:
    radial-gradient(
      ellipse at center,
      transparent 0 7px,
      #b88b36 7.5px 9px,
      #f2d37c 9.5px 10px,
      transparent 10.5px
    );

  background-size:32px 39px;
  background-repeat:repeat-y;
}


/* =====================================
   VIDEO
===================================== */

.page-video{
  width:100%;
  height:100%;

  display:block;

  object-fit:contain;

  background:#f7f3e9;

  border:0;
  outline:0;

  pointer-events:none;
}


/* hide all video controls */

video::-webkit-media-controls{
  display:none !important;
}

video::-webkit-media-controls-enclosure{
  display:none !important;
}

video::-webkit-media-controls-panel{
  display:none !important;
}

video::-webkit-media-controls-play-button{
  display:none !important;
}

video::-webkit-media-controls-start-playback-button{
  display:none !important;
}


/* =====================================
   NAVIGATION ARROWS
===================================== */

.nav-arrow{
  position:absolute;

  z-index:700;

  bottom:22px;

  width:48px;
  height:48px;

  border-radius:50%;

  border:1px solid rgba(0,0,0,.08);

  background:rgba(255,255,255,.86);

  backdrop-filter:blur(8px);

  display:flex;
  align-items:center;
  justify-content:center;

  color:#222;

  font-size:30px;

  cursor:pointer;

  box-shadow:
    0 4px 15px rgba(0,0,0,.12);

  transition:
    opacity .25s ease,
    transform .25s ease;
}


#nextBtn{
  right:16px;

  animation:
    arrowMove 1.35s ease-in-out infinite;
}


#prevBtn{
  left:42px;
}


@keyframes arrowMove{
  0%,
  100%{
    transform:translateX(0);
  }

  50%{
    transform:translateX(-6px);
  }
}


.nav-arrow.hidden{
  opacity:0;
  pointer-events:none;
}


/* =====================================
   SWIPE TEXT
===================================== */

.swipe-text{
  position:absolute;

  z-index:650;

  bottom:30px;

  left:50%;

  transform:translateX(-50%);

  color:#555;

  font-size:11px;

  background:
    rgba(255,255,255,.68);

  padding:6px 12px;

  border-radius:20px;

  pointer-events:none;

  white-space:nowrap;
}


/* =====================================
   MUSIC BUTTON
===================================== */

.music-btn{
  position:absolute;

  top:16px;
  right:16px;

  z-index:900;

  width:44px;
  height:44px;

  border:none;
  border-radius:50%;

  background:rgba(255,255,255,.88);

  backdrop-filter:blur(8px);

  color:#222;

  font-size:20px;

  cursor:pointer;

  box-shadow:
    0 4px 14px rgba(0,0,0,.12);
}


/* =====================================
   COUNTDOWN
===================================== */

.countdown-overlay{
  position:absolute;

  inset:0;

  z-index:90;

  pointer-events:none;
}


.countdown-number{
  position:absolute;

  display:flex;
  align-items:center;
  justify-content:center;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-weight:500;

  font-size:
    clamp(
      30px,
      9vw,
      48px
    );

  color:#202020;

  line-height:1;
}


/* DAYS */

#days{
  top:39%;
  left:22%;

  width:20%;
  height:10%;
}


/* HOURS */

#hours{
  top:39%;
  right:18%;

  width:20%;
  height:10%;
}


/* MINUTES */

#minutes{
  top:57%;
  left:22%;

  width:20%;
  height:10%;
}


/* SECONDS */

#seconds{
  top:57%;
  right:18%;

  width:20%;
  height:10%;
}


/* =====================================
   LOCATION CLICK AREA
===================================== */

.location-click{
  position:absolute;

  z-index:950;

  left:20%;
  width:62%;

  bottom:10%;
  height:11%;

  display:block;

  background:transparent;

  cursor:pointer;
}


/* =====================================
   RSVP CLICK AREA
===================================== */

.rsvp-click{
  position:absolute;

  z-index:950;

  left:18%;
  width:64%;

  top:52%;
  height:13%;

  display:block;

  background:transparent;

  cursor:pointer;
}


/* =====================================
   LARGE SCREENS
===================================== */

@media(min-width:600px){

  .book{
    border-radius:22px;

    box-shadow:
      0 20px 65px rgba(0,0,0,.18);
  }

}


/* =====================================
   REDUCED MOTION
===================================== */

@media(prefers-reduced-motion:reduce){

  .page{
    transition:none;
  }

  #nextBtn{
    animation:none;
  }

}

</style>
</head>


<body>

<div class="book-wrapper">

<div
  class="book"
  id="book"
>


<!-- =================================
     PAGE 01 COVER
================================= -->

<section class="page">

  <img
    src="cover.png"
    alt="Nada Graduation Cover"
  >

</section>


<!-- =================================
     PAGE 02 VIDEO
================================= -->

<section class="page">

  <video
    id="nadaVideo"
    class="page-video"

    playsinline
    webkit-playsinline

    preload="auto"

    muted

    disablepictureinpicture

    controlslist="nodownload noplaybackrate nofullscreen"
  >

    <source
      src="video.mp4"
      type="video/mp4"
    >

  </video>

</section>


<!-- =================================
     PAGE 03 SAVE THE TIME
================================= -->

<section class="page">

  <img
    src="savetime.png"
    alt="Save the Time"
  >

</section>


<!-- =================================
     PAGE 04 DATE & TIME
================================= -->

<section class="page">

  <img
    src="date-time.png"
    alt="Date and Time"
  >

</section>


<!-- =================================
     PAGE 05 COUNTDOWN
================================= -->

<section class="page">

  <img
    src="countdown.png"
    alt="Countdown"
  >


  <div class="countdown-overlay">

    <div
      class="countdown-number"
      id="days">
    </div>

    <div
      class="countdown-number"
      id="hours">
    </div>

    <div
      class="countdown-number"
      id="minutes">
    </div>

    <div
      class="countdown-number"
      id="seconds">
    </div>

  </div>

</section>


<!-- =================================
     PAGE 06 LOCATION
================================= -->

<section class="page">

  <img
    src="location.png"
    alt="Jasmine Hall Hebron"
  >


  <a
    class="location-click"
    href="https://maps.app.goo.gl/1EMywhgSKpQ3VcEL6"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Open Jasmine Hall location"
  ></a>

</section>


<!-- =================================
     PAGE 07 DRESS CODE
================================= -->

<section class="page">

  <img
    src="dress-code.png"
    alt="Dress Code"
  >

</section>


<!-- =================================
     PAGE 08 RSVP
================================= -->

<section class="page">

  <img
    src="rsvp.png"
    alt="RSVP"
  >


  <a
    class="rsvp-click"

    href="https://wa.me/970598494977?text=%D9%85%D8%B1%D8%AD%D8%A8%D8%A7%D9%8B%D8%8C%20%D8%A3%D8%A4%D9%83%D8%AF%20%D8%AD%D8%B6%D9%88%D8%B1%D9%8A%20%D9%84%D8%AD%D9%81%D9%84%20%D8%AA%D8%AE%D8%B1%D8%AC%20%D9%86%D8%AF%D9%89%20%F0%9F%8E%93%E2%9C%A8"

    target="_blank"

    rel="noopener noreferrer"

    aria-label="Confirm attendance on WhatsApp"
  ></a>

</section>


<!-- =================================
     SPIRAL
================================= -->

<div class="spiral"></div>


<!-- =================================
     MUSIC
================================= -->

<audio
  id="bgMusic"
  loop
  preload="auto"
>

  <source
    src="music.mp3"
    type="audio/mpeg"
  >

</audio>


<button
  id="musicBtn"
  class="music-btn"
  type="button"
  aria-label="Music"
>
♪
</button>


<!-- =================================
     PREVIOUS
================================= -->

<button
  id="prevBtn"
  class="nav-arrow hidden"
  type="button"
  aria-label="Previous page"
>
‹
</button>


<!-- =================================
     SWIPE TEXT
================================= -->

<div
  class="swipe-text"
  id="swipeText"
>
اسحبي الصفحة
</div>


<!-- =================================
     NEXT
================================= -->

<button
  id="nextBtn"
  class="nav-arrow"
  type="button"
  aria-label="Next page"
>
›
</button>


</div>

</div>


<script>

/* =====================================
   VARIABLES
===================================== */

const book =
  document.getElementById("book");


const pages =
  [...document.querySelectorAll(".page")];


const nextBtn =
  document.getElementById("nextBtn");


const prevBtn =
  document.getElementById("prevBtn");


const swipeText =
  document.getElementById("swipeText");


const nadaVideo =
  document.getElementById("nadaVideo");


const bgMusic =
  document.getElementById("bgMusic");


const musicBtn =
  document.getElementById("musicBtn");


let currentPage = 0;

let animating = false;

let musicPlaying = false;



/* =====================================
   NAVIGATION STATUS
===================================== */

function updateNavigation(){

  if(currentPage === 0){

    prevBtn.classList.add(
      "hidden"
    );

  }

  else{

    prevBtn.classList.remove(
      "hidden"
    );

  }


  if(
    currentPage ===
    pages.length - 1
  ){

    nextBtn.classList.add(
      "hidden"
    );

    swipeText.textContent =
      "الصفحة الأخيرة";

  }

  else{

    nextBtn.classList.remove(
      "hidden"
    );

    swipeText.textContent =
      "اسحبي الصفحة";

  }

}



/* =====================================
   NEXT PAGE
===================================== */

function nextPage(){

  if(animating){
    return;
  }


  if(
    currentPage >=
    pages.length - 1
  ){
    return;
  }


  animating = true;


  const page =
    pages[currentPage];


  page.classList.add(
    "flipping"
  );


  requestAnimationFrame(
    ()=>{

      page.classList.add(
        "flipped"
      );

    }
  );


  setTimeout(
    ()=>{

      page.classList.remove(
        "flipping"
      );


      currentPage++;


      updateNavigation();


      handleVideo();


      animating = false;

    },
    1000
  );

}



/* =====================================
   PREVIOUS PAGE
===================================== */

function previousPage(){

  if(animating){
    return;
  }


  if(currentPage <= 0){
    return;
  }


  animating = true;


  const previous =
    pages[
      currentPage - 1
    ];


  previous.classList.add(
    "flipping"
  );


  previous.classList.remove(
    "flipped"
  );


  setTimeout(
    ()=>{

      previous.classList.remove(
        "flipping"
      );


      currentPage--;


      updateNavigation();


      handleVideo();


      animating = false;

    },
    1000
  );

}



/* =====================================
   BUTTON NAVIGATION
===================================== */

nextBtn.addEventListener(
  "click",
  ()=>{

    startMusic();

    nextPage();

  }
);


prevBtn.addEventListener(
  "click",
  previousPage
);



/* =====================================
   TOUCH SWIPE
===================================== */

let startX = 0;
let startY = 0;


book.addEventListener(
  "touchstart",
  event=>{

    const touch =
      event.touches[0];


    startX =
      touch.clientX;


    startY =
      touch.clientY;


    startMusic();

  },
  {
    passive:true
  }
);


book.addEventListener(
  "touchend",
  event=>{

    const touch =
      event.changedTouches[0];


    const deltaX =
      touch.clientX -
      startX;


    const deltaY =
      touch.clientY -
      startY;


    if(
      Math.abs(deltaX) < 45
    ){
      return;
    }


    if(
      Math.abs(deltaX) <
      Math.abs(deltaY)
    ){
      return;
    }


    if(deltaX < 0){

      nextPage();

    }

    else{

      previousPage();

    }

  },
  {
    passive:true
  }
);



/* =====================================
   DESKTOP DRAG
===================================== */

let pointerStartX = 0;

let pointerDragging = false;


book.addEventListener(
  "pointerdown",
  event=>{

    /*
    لا نبدأ drag لو ضغط على
    رابط أو زر
    */

    if(
      event.target.closest("a") ||
      event.target.closest("button")
    ){
      return;
    }


    startMusic();


    pointerStartX =
      event.clientX;


    pointerDragging = true;

  }
);


book.addEventListener(
  "pointerup",
  event=>{

    if(!pointerDragging){
      return;
    }


    pointerDragging = false;


    const distance =
      event.clientX -
      pointerStartX;


    if(
      Math.abs(distance) < 55
    ){
      return;
    }


    if(distance < 0){

      nextPage();

    }

    else{

      previousPage();

    }

  }
);



/* =====================================
   VIDEO
===================================== */

function handleVideo(){

  /*
  VIDEO = PAGE 02
  index 1
  */

  if(currentPage === 1){

    nadaVideo.currentTime = 0;


    nadaVideo
    .play()
    .catch(()=>{});

  }

  else{

    nadaVideo.pause();

  }

}



/* =====================================
   AUTO NEXT AFTER VIDEO
===================================== */

nadaVideo.addEventListener(
  "ended",
  ()=>{

    if(currentPage === 1){

      setTimeout(
        ()=>{

          nextPage();

        },
        350
      );

    }

  }
);



/* =====================================
   BACKGROUND MUSIC
===================================== */

async function startMusic(){

  if(musicPlaying){
    return;
  }


  try{

    bgMusic.volume = 0.42;

    await bgMusic.play();


    musicPlaying = true;


    musicBtn.textContent =
      "♫";

  }

  catch(error){

    console.log(
      "Music waiting for user interaction"
    );

  }

}



/* =====================================
   MUSIC BUTTON
===================================== */

musicBtn.addEventListener(
  "click",
  async event=>{

    event.stopPropagation();


    if(musicPlaying){

      bgMusic.pause();


      musicPlaying =
        false;


      musicBtn.textContent =
        "♪";

    }

    else{

      try{

        bgMusic.volume =
          0.42;


        await bgMusic.play();


        musicPlaying =
          true;


        musicBtn.textContent =
          "♫";

      }

      catch(error){}

    }

  }
);



/* =====================================
   COUNTDOWN
===================================== */

const eventDate =
  new Date(
    "2027-07-27T19:00:00+03:00"
  );


function updateCountdown(){

  let diff =
    eventDate.getTime() -
    Date.now();


  if(diff < 0){

    diff = 0;

  }


  const day =
    1000 *
    60 *
    60 *
    24;


  const hour =
    1000 *
    60 *
    60;


  const minute =
    1000 *
    60;


  const days =
    Math.floor(
      diff / day
    );


  const hours =
    Math.floor(
      (diff % day) /
      hour
    );


  const minutes =
    Math.floor(
      (diff % hour) /
      minute
    );


  const seconds =
    Math.floor(
      (diff % minute) /
      1000
    );


  document
  .getElementById("days")
  .textContent =
    days;


  document
  .getElementById("hours")
  .textContent =
    String(hours)
    .padStart(
      2,
      "0"
    );


  document
  .getElementById("minutes")
  .textContent =
    String(minutes)
    .padStart(
      2,
      "0"
    );


  document
  .getElementById("seconds")
  .textContent =
    String(seconds)
    .padStart(
      2,
      "0"
    );

}


updateCountdown();


setInterval(
  updateCountdown,
  1000
);



/* =====================================
   KEYBOARD
===================================== */

document.addEventListener(
  "keydown",
  event=>{

    if(
      event.key ===
      "ArrowLeft"
    ){

      nextPage();

    }


    if(
      event.key ===
      "ArrowRight"
    ){

      previousPage();

    }

  }
);



/* =====================================
   INITIALIZE
===================================== */

updateNavigation();

</script>

</body>
</html>
