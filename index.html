<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Nada Graduation Invitation</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
  background:#dcebf5;
  font-family:Arial, sans-serif;
}

.book{
  position:relative;
  width:100%;
  max-width:480px;
  height:100%;
  overflow:hidden;
  background:#dcebf5;
  perspective:1800px;
  touch-action:none;
}

/* =========================
   PAGES
========================= */

.page{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#dcebf5;

  transform-origin:left center;
  transform-style:preserve-3d;
  backface-visibility:hidden;

  transition:
    transform .85s cubic-bezier(.65,.05,.36,1),
    opacity .45s ease;

  opacity:0;
  pointer-events:none;
}

/* الصفحة الحالية */
.page.current{
  transform:translateX(0) rotateY(0deg);
  opacity:1;
  z-index:20;
  pointer-events:auto;
}

/* الصفحة القادمة موجودة تحت الحالية */
.page.after{
  transform:translateX(0) rotateY(0deg);
  opacity:1;
  z-index:10;
}

/* الصفحة السابقة */
.page.before{
  transform:translateX(-100%) rotateY(-95deg);
  opacity:0;
  z-index:5;
}

/* أثناء تقليب الصفحة */
.page.flip-out{
  transform:translateX(-100%) rotateY(-100deg);
  opacity:0;
  z-index:30;
}

/* رجوع الصفحة */
.page.flip-back{
  transform:translateX(0) rotateY(0deg);
  opacity:1;
  z-index:30;
}

.page img,
.page video{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}

.page img{
  pointer-events:none;
  user-select:none;
  -webkit-user-drag:none;
}

/* =========================
   VIDEO
========================= */

.page-video{
  border:0;
  outline:0;
  background:#dcebf5;
  pointer-events:none;
}

video::-webkit-media-controls{
  display:none !important;
}

video::-webkit-media-controls-enclosure{
  display:none !important;
}

video::-webkit-media-controls-panel{
  display:none !important;
}

/* =========================
   COUNTDOWN
========================= */

.countdown-overlay{
  position:absolute;

  /* عدلي هذه لاحقًا لو احتجنا */
  top:35%;
  left:14%;

  width:72%;
  height:38%;

  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;

  column-gap:9%;
  row-gap:7%;

  direction:ltr;

  z-index:50;
  pointer-events:none;
}

.countdown-number{
  display:flex;
  align-items:center;
  justify-content:center;

  padding-bottom:22%;

  font-family:Georgia, "Times New Roman", serif;
  font-size:clamp(32px,9vw,52px);

  color:#222;
}

/* =========================
   LOCATION
========================= */

.location-click{
  position:absolute;

  left:20%;
  width:62%;

  bottom:10%;
  height:11%;

  z-index:100;

  border:0;
  background:transparent;
  cursor:pointer;
}

/* =========================
   RSVP
========================= */

.rsvp-click{
  position:absolute;

  left:18%;
  width:64%;

  top:52%;
  height:13%;

  z-index:100;

  border:0;
  background:transparent;
  cursor:pointer;
}

/* =========================
   DESKTOP
========================= */

@media(min-width:500px){
  .book{
    height:min(100vh,900px);
    border-radius:20px;
    box-shadow:0 20px 60px rgba(0,0,0,.18);
  }
}
</style>
</head>

<body>

<div class="book" id="book">

  <!-- PAGE 1 -->
  <section class="page current">
    <img src="cover.png" alt="Cover">
  </section>

  <!-- PAGE 2 VIDEO -->
  <section class="page after">
    <video
      id="nadaVideo"
      class="page-video"
      playsinline
      webkit-playsinline
      preload="auto"
      disablepictureinpicture
    >
      <source src="video.mp4" type="video/mp4">
    </video>
  </section>

  <!-- PAGE 3 -->
  <section class="page">
    <img src="savetime.png" alt="Save the Time">
  </section>

  <!-- PAGE 4 -->
  <section class="page">
    <img src="date-time.png" alt="Date and Time">
  </section>

  <!-- PAGE 5 COUNTDOWN -->
  <section class="page">
    <img src="countdown.png" alt="Countdown">

    <div class="countdown-overlay">
      <div class="countdown-number" id="days"></div>
      <div class="countdown-number" id="hours"></div>
      <div class="countdown-number" id="minutes"></div>
      <div class="countdown-number" id="seconds"></div>
    </div>
  </section>

  <!-- PAGE 6 LOCATION -->
  <section class="page">
    <img src="location.png" alt="Location">

    <button
      type="button"
      class="location-click"
      id="locationButton"
      aria-label="Open location">
    </button>
  </section>

  <!-- PAGE 7 -->
  <section class="page">
    <img src="dress-code.png" alt="Dress Code">
  </section>

  <!-- PAGE 8 RSVP -->
  <section class="page">
    <img src="rsvp.png" alt="RSVP">

    <button
      type="button"
      class="rsvp-click"
      id="rsvpButton"
      aria-label="Confirm attendance">
    </button>
  </section>

</div>

<script>

/* =========================
   PAGES
========================= */

const book = document.getElementById("book");
const pages = [...document.querySelectorAll(".page")];

let currentPage = 0;
let animating = false;


/* =========================
   UPDATE STATES
========================= */

function setPageStates(){

  pages.forEach((page,index)=>{

    page.classList.remove(
      "current",
      "after",
      "before",
      "flip-out",
      "flip-back"
    );

    if(index < currentPage){

      page.classList.add("before");

    }else if(index === currentPage){

      page.classList.add("current");

    }else if(index === currentPage + 1){

      page.classList.add("after");

    }

  });

  handleVideo();

}


/* =========================
   NEXT
========================= */

function nextPage(){

  if(animating) return;

  if(currentPage >= pages.length - 1) return;

  animating = true;

  const oldPage = pages[currentPage];
  const newPage = pages[currentPage + 1];

  /* الصفحة القادمة تظهر تحت الحالية */
  newPage.classList.remove("after");
  newPage.classList.add("current");

  /* الصفحة الحالية تنقلب */
  oldPage.classList.remove("current");
  oldPage.classList.add("flip-out");

  setTimeout(()=>{

    currentPage++;

    setPageStates();

    animating = false;

  },850);

}


/* =========================
   PREVIOUS
========================= */

function previousPage(){

  if(animating) return;

  if(currentPage <= 0) return;

  animating = true;

  const current = pages[currentPage];
  const previous = pages[currentPage - 1];

  current.classList.remove("current");
  current.classList.add("after");

  previous.classList.remove("before");
  previous.classList.add("flip-back");

  setTimeout(()=>{

    currentPage--;

    setPageStates();

    animating = false;

  },850);

}


/* =========================
   TOUCH
========================= */

let startX = 0;
let startY = 0;


book.addEventListener(
  "touchstart",
  e=>{

    const touch = e.touches[0];

    startX = touch.clientX;
    startY = touch.clientY;

  },
  {passive:true}
);


book.addEventListener(
  "touchend",
  e=>{

    const touch = e.changedTouches[0];

    const dx = touch.clientX - startX;
    const dy = touch.clientY - startY;

    if(Math.abs(dx) < 45) return;

    if(Math.abs(dx) < Math.abs(dy)) return;

    if(dx < 0){
      nextPage();
    }else{
      previousPage();
    }

  },
  {passive:true}
);


/* =========================
   COMPUTER MOUSE
========================= */

let mouseDown = false;
let mouseStartX = 0;


book.addEventListener("pointerdown",e=>{

  if(e.target.closest("button")) return;

  mouseDown = true;
  mouseStartX = e.clientX;

});


book.addEventListener("pointerup",e=>{

  if(!mouseDown) return;

  mouseDown = false;

  const dx = e.clientX - mouseStartX;

  if(Math.abs(dx) < 55) return;

  if(dx < 0){
    nextPage();
  }else{
    previousPage();
  }

});


/* =========================
   VIDEO
========================= */

const nadaVideo = document.getElementById("nadaVideo");


function handleVideo(){

  /*
  الفيديو هو الصفحة رقم 2
  index = 1
  */

  if(currentPage === 1){

    nadaVideo.currentTime = 0;

    nadaVideo.play().catch(()=>{});

  }else{

    nadaVideo.pause();

  }

}


/* بعد انتهاء الفيديو */

nadaVideo.addEventListener("ended",()=>{

  if(currentPage === 1){

    setTimeout(()=>{
      nextPage();
    },300);

  }

});


/* =========================
   COUNTDOWN
========================= */

const eventDate =
  new Date("2027-07-27T19:00:00+03:00");


function updateCountdown(){

  let diff =
    eventDate.getTime() -
    Date.now();


  if(diff < 0){
    diff = 0;
  }


  const day =
    1000 * 60 * 60 * 24;

  const hour =
    1000 * 60 * 60;

  const minute =
    1000 * 60;


  const days =
    Math.floor(diff / day);


  const hours =
    Math.floor(
      (diff % day) / hour
    );


  const minutes =
    Math.floor(
      (diff % hour) / minute
    );


  const seconds =
    Math.floor(
      (diff % minute) / 1000
    );


  document.getElementById("days")
    .textContent = days;

  document.getElementById("hours")
    .textContent =
    String(hours).padStart(2,"0");

  document.getElementById("minutes")
    .textContent =
    String(minutes).padStart(2,"0");

  document.getElementById("seconds")
    .textContent =
    String(seconds).padStart(2,"0");

}


updateCountdown();

setInterval(
  updateCountdown,
  1000
);


/* =========================
   LOCATION
========================= */

document
.getElementById("locationButton")
.addEventListener("click",()=>{

  window.open(
    "https://maps.app.goo.gl/1EMywhgSKpQ3VcEL6",
    "_blank"
  );

});


/* =========================
   RSVP
========================= */

const whatsappNumber =
  "970598494977";


const whatsappMessage =
  "مرحباً، أؤكد حضوري لحفل تخرج ندى 🎓✨";


document
.getElementById("rsvpButton")
.addEventListener("click",()=>{

  const url =
    "https://wa.me/" +
    whatsappNumber +
    "?text=" +
    encodeURIComponent(
      whatsappMessage
    );

  window.open(
    url,
    "_blank"
  );

});


/* =========================
   KEYBOARD
========================= */

document.addEventListener("keydown",e=>{

  if(e.key === "ArrowLeft"){
    nextPage();
  }

  if(e.key === "ArrowRight"){
    previousPage();
  }

});


/* =========================
   START
========================= */

setPageStates();

</script>

</body>
</html>
