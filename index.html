<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<title>Nada Graduation Invitation</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#dcecf7;
}

body{
  font-family:Arial, sans-serif;
}

/* =========================
   BOOK
========================= */

.book{
  position:relative;

  width:100vw;
  height:100vh;
  height:100dvh;

  overflow:hidden;

  background:#dcecf7;

  perspective:2200px;

  touch-action:none;
}

/* =========================
   PAGES
========================= */

.page{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  overflow:hidden;

  background:#dcecf7;

  transform-origin:left center;

  transform-style:preserve-3d;

  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;

  transition:
    transform .9s cubic-bezier(.55,.05,.25,1);

  will-change:transform;
}

/* =========================
   IMAGE — FULL IMAGE
   NO CROPPING
========================= */

.page > img{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  display:block;

  object-fit:contain;
  object-position:center center;

  background:#dcecf7;

  image-rendering:auto;

  pointer-events:none;

  user-select:none;
  -webkit-user-select:none;
  -webkit-user-drag:none;
}

/* =========================
   STACK
========================= */

.page:nth-of-type(1){z-index:80;}
.page:nth-of-type(2){z-index:70;}
.page:nth-of-type(3){z-index:60;}
.page:nth-of-type(4){z-index:50;}
.page:nth-of-type(5){z-index:40;}
.page:nth-of-type(6){z-index:30;}
.page:nth-of-type(7){z-index:20;}
.page:nth-of-type(8){z-index:10;}

/* =========================
   NOTEBOOK FLIP
========================= */

.page.flipped{
  transform:rotateY(-180deg);
  pointer-events:none;
}

.page::after{
  content:"";

  position:absolute;
  inset:0;

  z-index:5;

  pointer-events:none;

  opacity:0;

  background:
    linear-gradient(
      90deg,
      rgba(0,0,0,.18),
      rgba(0,0,0,.05) 16%,
      transparent 40%
    );

  transition:opacity .4s ease;
}

.page.flipping::after{
  opacity:1;
}

/* =========================
   VIDEO
========================= */

.page-video{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  display:block;

  object-fit:contain;
  object-position:center center;

  background:#dcecf7;

  border:0;
  outline:0;

  pointer-events:none;
}

video::-webkit-media-controls,
video::-webkit-media-controls-enclosure,
video::-webkit-media-controls-panel,
video::-webkit-media-controls-play-button,
video::-webkit-media-controls-start-playback-button{
  display:none !important;
}

/* =========================
   MUSIC
========================= */

.music-btn{
  position:absolute;

  top:calc(14px + env(safe-area-inset-top));
  right:calc(14px + env(safe-area-inset-right));

  z-index:1000;

  width:46px;
  height:46px;

  border:0;
  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(255,255,255,.94);

  color:#111;

  font-size:20px;

  cursor:pointer;

  box-shadow:
    0 5px 16px rgba(0,0,0,.14);
}

/* =========================
   NAVIGATION
========================= */

.nav-arrow{
  position:absolute;

  bottom:calc(18px + env(safe-area-inset-bottom));

  z-index:900;

  width:46px;
  height:46px;

  border:0;
  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(255,255,255,.94);

  color:#222;

  font-size:29px;

  cursor:pointer;

  box-shadow:
    0 4px 14px rgba(0,0,0,.14);

  transition:
    opacity .25s ease,
    transform .25s ease;
}

#prevBtn{
  left:14px;
}

#nextBtn{
  right:14px;

  animation:
    arrowMove 1.3s ease-in-out infinite;
}

@keyframes arrowMove{

  0%,
  100%{
    transform:translateX(0);
  }

  50%{
    transform:translateX(-5px);
  }
}

.nav-arrow.hidden{
  opacity:0;
  pointer-events:none;
}

/* الغلاف بدون أسهم */

.book.first-page .nav-arrow{
  opacity:0;
  pointer-events:none;
}

/* خلال الفيديو:
   لا Next ولا Previous */

.book.video-playing .nav-arrow{
  opacity:0;
  pointer-events:none;
}

/* =========================
   VIDEO WAIT MESSAGE
========================= */

.video-lock{
  position:absolute;

  left:50%;

  bottom:calc(20px + env(safe-area-inset-bottom));

  transform:translateX(-50%);

  z-index:850;

  padding:7px 14px;

  border-radius:22px;

  background:rgba(255,255,255,.88);

  color:#555;

  font-size:11px;

  white-space:nowrap;

  pointer-events:none;

  opacity:0;

  transition:opacity .3s ease;
}

.book.video-playing .video-lock{
  opacity:1;
}

/* =========================
   COUNTDOWN
========================= */

.countdown-overlay{
  position:absolute;
  inset:0;

  z-index:100;

  pointer-events:none;
}

.countdown-number{
  position:absolute;

  transform:
    translate(-50%,-50%);

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  width:22%;
  height:10%;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:
    clamp(30px,9vw,48px);

  font-weight:500;

  color:#202020;

  line-height:1;
}

/* أرقام التايمر */

#days{
  left:29%;
  top:48%;
}

#hours{
  left:69%;
  top:48%;
}

#minutes{
  left:29%;
  top:69%;
}

#seconds{
  left:69%;
  top:69%;
}

/* =========================
   LOCATION LINK
========================= */

.location-click{
  position:absolute;

  z-index:500;

  left:18%;
  width:64%;

  bottom:8%;
  height:13%;

  display:block;

  background:transparent;
}

/* =========================
   RSVP
========================= */

.rsvp-click{
  position:absolute;

  z-index:500;

  left:18%;
  width:64%;

  top:56%;
  height:12%;

  display:block;

  background:transparent;
}

</style>
</head>

<body>

<div
  class="book first-page"
  id="book"
>

  <!-- PAGE 01 -->
  <section class="page">
    <img
      src="cover.png"
      alt="Nada Graduation Cover"
    >
  </section>


  <!-- PAGE 02 — VIDEO -->
  <section class="page">

    <video
      id="nadaVideo"
      class="page-video"

      playsinline
      webkit-playsinline

      preload="auto"

      muted

      disablepictureinpicture

      controlslist="nodownload noplaybackrate nofullscreen"
    >

      <source
        src="video.mp4"
        type="video/mp4"
      >

    </video>

  </section>


  <!-- PAGE 03 -->
  <section class="page">

    <img
      src="savetime.png"
      alt="Save the Time"
    >

  </section>


  <!-- PAGE 04 -->
  <section class="page">

    <img
      src="date-time.png"
      alt="Date and Time"
    >

  </section>


  <!-- PAGE 05 — COUNTDOWN -->
  <section class="page">

    <img
      src="countdown.png"
      alt="Countdown"
    >

    <div class="countdown-overlay">

      <div
        id="days"
        class="countdown-number">
      </div>

      <div
        id="hours"
        class="countdown-number">
      </div>

      <div
        id="minutes"
        class="countdown-number">
      </div>

      <div
        id="seconds"
        class="countdown-number">
      </div>

    </div>

  </section>


  <!-- PAGE 06 — LOCATION -->
  <section class="page">

    <img
      src="location.png"
      alt="Jasmine Hall Hebron"
    >

    <a
      class="location-click"

      href="https://maps.app.goo.gl/1EMywhgSKpQ3VcEL6"

      target="_blank"

      rel="noopener noreferrer"

      aria-label="Open Location"
    ></a>

  </section>


  <!-- PAGE 07 -->
  <section class="page">

    <img
      src="dress-code.png"
      alt="Dress Code"
    >

  </section>


  <!-- PAGE 08 -->
  <section class="page">

    <img
      src="rsvp.png"
      alt="Confirm Attendance"
    >

    <a
      class="rsvp-click"

      href="https://wa.me/970598494977?text=%D9%85%D8%B1%D8%AD%D8%A8%D8%A7%D9%8B%D8%8C%20%D8%A3%D8%A4%D9%83%D8%AF%20%D8%AD%D8%B6%D9%88%D8%B1%D9%8A%20%D9%84%D8%AD%D9%81%D9%84%20%D8%AA%D8%AE%D8%B1%D8%AC%20%D9%86%D8%AF%D9%89%20%F0%9F%8E%93%E2%9C%A8"

      target="_blank"

      rel="noopener noreferrer"

      aria-label="Confirm Attendance"
    ></a>

  </section>


  <!-- BACKGROUND MUSIC -->

  <audio
    id="bgMusic"
    loop
    preload="auto"
  >

    <source
      src="music.mp3"
      type="audio/mpeg"
    >

  </audio>


  <button
    id="musicBtn"
    class="music-btn"
    type="button"
    aria-label="Music"
  >
    ♪
  </button>


  <!-- NAVIGATION -->

  <button
    id="prevBtn"
    class="nav-arrow hidden"
    type="button"
    aria-label="Previous Page"
  >
    ‹
  </button>


  <div
    class="video-lock"
    id="videoLock"
  >
    انتظري حتى ينتهي الفيديو
  </div>


  <button
    id="nextBtn"
    class="nav-arrow hidden"
    type="button"
    aria-label="Next Page"
  >
    ›
  </button>

</div>


<script>

/* =========================
   VARIABLES
========================= */

const book =
  document.getElementById("book");

const pages =
  [...document.querySelectorAll(".page")];

const nextBtn =
  document.getElementById("nextBtn");

const prevBtn =
  document.getElementById("prevBtn");

const nadaVideo =
  document.getElementById("nadaVideo");

const bgMusic =
  document.getElementById("bgMusic");

const musicBtn =
  document.getElementById("musicBtn");


let currentPage = 0;

let animating = false;


/*
هل الفيديو يعمل الآن؟
*/
let videoPlaying = false;


/*
هل الفيديو انتهى؟
*/
let videoFinished = false;


let musicPlaying = false;

let musicManuallyStopped = false;


/* =========================
   NAVIGATION
========================= */

function updateNavigation(){

  if(currentPage === 0){

    book.classList.add(
      "first-page"
    );

    book.classList.remove(
      "video-playing"
    );

    prevBtn.classList.add(
      "hidden"
    );

    nextBtn.classList.add(
      "hidden"
    );

    return;
  }


  book.classList.remove(
    "first-page"
  );


  /*
  VIDEO PAGE
  */

  if(
    currentPage === 1 &&
    !videoFinished
  ){

    book.classList.add(
      "video-playing"
    );

    prevBtn.classList.add(
      "hidden"
    );

    nextBtn.classList.add(
      "hidden"
    );

    return;
  }


  book.classList.remove(
    "video-playing"
  );


  /*
  PREVIOUS
  */

  if(currentPage > 0){

    prevBtn.classList.remove(
      "hidden"
    );

  }else{

    prevBtn.classList.add(
      "hidden"
    );

  }


  /*
  NEXT
  */

  if(
    currentPage ===
    pages.length - 1
  ){

    nextBtn.classList.add(
      "hidden"
    );

  }else{

    nextBtn.classList.remove(
      "hidden"
    );

  }

}


/* =========================
   NEXT
========================= */

function nextPage(){

  if(animating){
    return;
  }


  /*
  ممنوع الخروج من صفحة
  الفيديو قبل انتهائه
  */

  if(
    currentPage === 1 &&
    !videoFinished
  ){
    return;
  }


  if(
    currentPage >=
    pages.length - 1
  ){
    return;
  }


  animating = true;


  const current =
    pages[currentPage];


  current.classList.add(
    "flipping"
  );


  requestAnimationFrame(
    ()=>{

      current.classList.add(
        "flipped"
      );

    }
  );


  setTimeout(
    ()=>{

      current.classList.remove(
        "flipping"
      );


      currentPage++;


      /*
      إذا وصلنا للفيديو
      نبدأه فورًا
      */

      if(currentPage === 1){

        startVideoPage();

      }else{

        stopVideoPage();

      }


      updateNavigation();


      animating = false;

    },
    900
  );

}


/* =========================
   PREVIOUS
========================= */

function previousPage(){

  if(animating){
    return;
  }


  /*
  أثناء الفيديو ممنوع الرجوع أيضًا
  */

  if(
    currentPage === 1 &&
    !videoFinished
  ){
    return;
  }


  if(currentPage <= 0){
    return;
  }


  animating = true;


  const previous =
    pages[currentPage - 1];


  previous.classList.add(
    "flipping"
  );


  previous.classList.remove(
    "flipped"
  );


  setTimeout(
    ()=>{

      previous.classList.remove(
        "flipping"
      );


      currentPage--;


      if(currentPage === 1){

        startVideoPage();

      }else{

        stopVideoPage();

      }


      updateNavigation();


      animating = false;

    },
    900
  );

}


/* =========================
   VIDEO
========================= */

async function startVideoPage(){

  videoFinished = false;

  videoPlaying = true;


  book.classList.add(
    "video-playing"
  );


  nadaVideo.pause();

  nadaVideo.currentTime = 0;


  try{

    await nadaVideo.play();

  }

  catch(error){

    /*
    الفيديو muted وبالتالي
    المفروض يعمل مباشرة
    على أغلب الأجهزة
    */

    console.log(
      "Video playback error",
      error
    );

  }

}


function stopVideoPage(){

  videoPlaying = false;


  nadaVideo.pause();

  nadaVideo.currentTime = 0;


  book.classList.remove(
    "video-playing"
  );

}


/* =========================
   VIDEO ENDED
========================= */

nadaVideo.addEventListener(
  "ended",
  ()=>{

    if(currentPage !== 1){
      return;
    }


    videoPlaying = false;

    videoFinished = true;


    book.classList.remove(
      "video-playing"
    );


    /*
    بعد انتهاء الفيديو
    ينتقل تلقائيًا
    */

    setTimeout(
      ()=>{

        nextPage();

      },
      250
    );

  }
);


/* =========================
   BUTTONS
========================= */

nextBtn.addEventListener(
  "click",
  event=>{

    event.stopPropagation();

    tryStartMusic();

    nextPage();

  }
);


prevBtn.addEventListener(
  "click",
  event=>{

    event.stopPropagation();

    previousPage();

  }
);


/* =========================
   TOUCH SWIPE
========================= */

let startX = 0;
let startY = 0;


book.addEventListener(
  "touchstart",
  event=>{

    if(
      event.target.closest("a") ||
      event.target.closest("button")
    ){
      return;
    }


    const touch =
      event.touches[0];


    startX =
      touch.clientX;


    startY =
      touch.clientY;


    tryStartMusic();

  },
  {
    passive:true
  }
);


book.addEventListener(
  "touchend",
  event=>{

    if(
      event.target.closest("a") ||
      event.target.closest("button")
    ){
      return;
    }


    /*
    أثناء تشغيل الفيديو:
    لا نسمح بأي تقليب
    */

    if(
      currentPage === 1 &&
      !videoFinished
    ){
      return;
    }


    const touch =
      event.changedTouches[0];


    const dx =
      touch.clientX -
      startX;


    const dy =
      touch.clientY -
      startY;


    if(
      Math.abs(dx) < 45
    ){
      return;
    }


    if(
      Math.abs(dx) <
      Math.abs(dy)
    ){
      return;
    }


    if(dx < 0){

      nextPage();

    }else{

      previousPage();

    }

  },
  {
    passive:true
  }
);


/* =========================
   MUSIC
========================= */

async function tryStartMusic(){

  if(musicManuallyStopped){
    return;
  }


  if(musicPlaying){
    return;
  }


  try{

    bgMusic.volume =
      0.42;


    await bgMusic.play();


    musicPlaying =
      true;


    musicBtn.textContent =
      "♫";

  }

  catch(error){}

}


musicBtn.addEventListener(
  "click",
  async event=>{

    event.stopPropagation();


    if(musicPlaying){

      bgMusic.pause();


      musicPlaying =
        false;


      musicManuallyStopped =
        true;


      musicBtn.textContent =
        "♪";


      return;

    }


    try{

      musicManuallyStopped =
        false;


      bgMusic.volume =
        0.42;


      await bgMusic.play();


      musicPlaying =
        true;


      musicBtn.textContent =
        "♫";

    }

    catch(error){}

  }
);


/* =========================
   COUNTDOWN
========================= */

const eventDate =
  new Date(
    "2027-07-27T19:00:00+03:00"
  );


function updateCountdown(){

  let difference =
    eventDate.getTime() -
    Date.now();


  if(difference < 0){

    difference = 0;

  }


  const oneDay =
    1000 * 60 * 60 * 24;


  const oneHour =
    1000 * 60 * 60;


  const oneMinute =
    1000 * 60;


  const days =
    Math.floor(
      difference /
      oneDay
    );


  const hours =
    Math.floor(
      (difference % oneDay) /
      oneHour
    );


  const minutes =
    Math.floor(
      (difference % oneHour) /
      oneMinute
    );


  const seconds =
    Math.floor(
      (difference % oneMinute) /
      1000
    );


  document
    .getElementById("days")
    .textContent =
    days;


  document
    .getElementById("hours")
    .textContent =
    String(hours)
      .padStart(2,"0");


  document
    .getElementById("minutes")
    .textContent =
    String(minutes)
      .padStart(2,"0");


  document
    .getElementById("seconds")
    .textContent =
    String(seconds)
      .padStart(2,"0");

}


updateCountdown();

setInterval(
  updateCountdown,
  1000
);


/* =========================
   START
========================= */

updateNavigation();

</script>

</body>
</html>
