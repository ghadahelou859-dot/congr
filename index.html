<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
/>
<title>Nada Graduation Invitation</title>

<style>
/* =====================================
   RESET
===================================== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#dfeaf3;
  font-family:Arial,sans-serif;
}

body{
  position:relative;
}

/* =====================================
   ROOT SAFE AREAS
===================================== */

:root{
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
}

/* =====================================
   BOOK
===================================== */

.book{
  position:relative;
  width:100vw;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  background:#dfeaf3;
  perspective:2200px;
  touch-action:none;
}

/* =====================================
   PAGE
===================================== */

.page{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#dfeaf3;

  transform-origin:left center;
  transform-style:preserve-3d;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;

  transition:
    transform .9s cubic-bezier(.55,.05,.25,1),
    opacity .45s ease;

  will-change:transform;
}

.page:nth-of-type(1){z-index:80;}
.page:nth-of-type(2){z-index:70;}
.page:nth-of-type(3){z-index:60;}
.page:nth-of-type(4){z-index:50;}
.page:nth-of-type(5){z-index:40;}
.page:nth-of-type(6){z-index:30;}
.page:nth-of-type(7){z-index:20;}
.page:nth-of-type(8){z-index:10;}

/* =====================================
   PAGE FLIP
===================================== */

.page.flipped{
  transform:rotateY(-180deg);
  pointer-events:none;
}

.page::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:5;
  pointer-events:none;
  opacity:0;
  background:
    linear-gradient(
      90deg,
      rgba(0,0,0,.18),
      rgba(0,0,0,.06) 16%,
      rgba(0,0,0,0) 40%
    );
  transition:opacity .45s ease;
}

.page.flipping::after{
  opacity:1;
}

/* =====================================
   IMAGES
   full screen responsive
===================================== */

.page > img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;

  object-fit:cover;
  object-position:center center;

  pointer-events:none;
  user-select:none;
  -webkit-user-select:none;
  -webkit-user-drag:none;
}

/* إذا احتجتِ إظهار جهة السلك أكثر
   عدلي فقط هذا الرقم إلى 46% أو 44% */
.page.focus-left > img{
  object-position:46% center;
}

/* =====================================
   VIDEO
===================================== */

.page-video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;

  object-fit:cover;
  object-position:center center;

  background:#dfeaf3;
  border:0;
  outline:0;
  pointer-events:none;
}

video::-webkit-media-controls,
video::-webkit-media-controls-enclosure,
video::-webkit-media-controls-panel,
video::-webkit-media-controls-play-button,
video::-webkit-media-controls-start-playback-button{
  display:none !important;
}

/* =====================================
   MUSIC BUTTON
===================================== */

.music-btn{
  position:absolute;
  top:calc(14px + var(--safe-top));
  right:calc(14px + var(--safe-right));

  z-index:1000;

  width:clamp(44px, 5vw, 52px);
  height:clamp(44px, 5vw, 52px);

  display:flex;
  align-items:center;
  justify-content:center;

  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.94);
  color:#111;
  font-size:clamp(18px,2vw,22px);
  cursor:pointer;
  box-shadow:0 5px 16px rgba(0,0,0,.15);
}

/* =====================================
   NAVIGATION
===================================== */

.nav-arrow{
  position:absolute;
  bottom:calc(18px + var(--safe-bottom));
  z-index:900;

  width:clamp(44px,5vw,52px);
  height:clamp(44px,5vw,52px);

  display:flex;
  align-items:center;
  justify-content:center;

  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.93);
  color:#222;
  font-size:clamp(26px,3vw,32px);
  cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,.14);

  transition:
    opacity .25s ease,
    transform .25s ease;
}

#prevBtn{
  left:calc(16px + var(--safe-left));
}

#nextBtn{
  right:calc(16px + var(--safe-right));
  animation:nextArrowMove 1.3s ease-in-out infinite;
}

@keyframes nextArrowMove{
  0%,100%{ transform:translateX(0); }
  50%{ transform:translateX(-5px); }
}

.nav-arrow.hidden{
  opacity:0;
  pointer-events:none;
}

.book.first-page .nav-arrow{
  opacity:0;
  pointer-events:none;
}

/* =====================================
   SWIPE LABEL
===================================== */

.swipe-label{
  position:absolute;
  left:50%;
  bottom:calc(25px + var(--safe-bottom));
  transform:translateX(-50%);

  z-index:850;

  padding:6px 13px;
  border-radius:20px;
  background:rgba(255,255,255,.88);
  color:#555;
  font-size:clamp(10px,1.5vw,12px);
  white-space:nowrap;
  pointer-events:none;
}

.book.first-page .swipe-label{
  display:none;
}

/* =====================================
   COUNTDOWN
===================================== */

.countdown-overlay{
  position:absolute;
  inset:0;
  z-index:100;
  pointer-events:none;
}

.countdown-number{
  position:absolute;
  transform:translate(-50%,-50%);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;

  min-width:10%;
  min-height:6%;

  font-family:Georgia, "Times New Roman", serif;
  font-size:clamp(32px,5vw,58px);
  font-weight:500;
  color:#202020;
  line-height:1;
}

/* هذه القيم متمركزة داخل المنطقة البيضاء */
#days{
  left:30%;
  top:46%;
}

#hours{
  left:69%;
  top:46%;
}

#minutes{
  left:30%;
  top:68%;
}

#seconds{
  left:69%;
  top:68%;
}

/* =====================================
   LOCATION CLICK AREA
===================================== */

.location-click{
  position:absolute;
  left:18%;
  width:64%;
  bottom:8%;
  height:13%;
  z-index:500;
  display:block;
  background:transparent;
}

/* =====================================
   RSVP CLICK AREA
===================================== */

.rsvp-click{
  position:absolute;
  left:18%;
  width:64%;
  top:56%;
  height:12%;
  z-index:500;
  display:block;
  background:transparent;
}

/* =====================================
   REDUCED MOTION
===================================== */

@media (prefers-reduced-motion: reduce){
  .page{
    transition:none;
  }

  #nextBtn{
    animation:none;
  }
}
</style>
</head>
<body>

<div class="book first-page" id="book">

  <!-- PAGE 01 COVER -->
  <section class="page focus-left">
    <img src="cover.png" alt="Nada Graduation Cover" />
  </section>

  <!-- PAGE 02 VIDEO -->
  <section class="page focus-left">
    <video
      id="nadaVideo"
      class="page-video"
      playsinline
      webkit-playsinline
      preload="auto"
      muted
      disablepictureinpicture
      controlslist="nodownload noplaybackrate nofullscreen"
    >
      <source src="video.mp4" type="video/mp4" />
    </video>
  </section>

  <!-- PAGE 03 SAVE TIME -->
  <section class="page focus-left">
    <img src="savetime.png" alt="Save the Time" />
  </section>

  <!-- PAGE 04 DATE TIME -->
  <section class="page focus-left">
    <img src="date-time.png" alt="Date and Time" />
  </section>

  <!-- PAGE 05 COUNTDOWN -->
  <section class="page focus-left">
    <img src="countdown.png" alt="Countdown" />
    <div class="countdown-overlay">
      <div class="countdown-number" id="days"></div>
      <div class="countdown-number" id="hours"></div>
      <div class="countdown-number" id="minutes"></div>
      <div class="countdown-number" id="seconds"></div>
    </div>
  </section>

  <!-- PAGE 06 LOCATION -->
  <section class="page focus-left">
    <img src="location.png" alt="Jasmine Hall Hebron" />
    <a
      class="location-click"
      href="https://maps.app.goo.gl/1EMywhgSKpQ3VcEL6"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Open Location"
    ></a>
  </section>

  <!-- PAGE 07 DRESS CODE -->
  <section class="page focus-left">
    <img src="dress-code.png" alt="Dress Code" />
  </section>

  <!-- PAGE 08 RSVP -->
  <section class="page focus-left">
    <img src="rsvp.png" alt="Confirm Attendance" />
    <a
      class="rsvp-click"
      href="https://wa.me/970598494977?text=%D9%85%D8%B1%D8%AD%D8%A8%D8%A7%D9%8B%D8%8C%20%D8%A3%D8%A4%D9%83%D8%AF%20%D8%AD%D8%B6%D9%88%D8%B1%D9%8A%20%D9%84%D8%AD%D9%81%D9%84%20%D8%AA%D8%AE%D8%B1%D8%AC%20%D9%86%D8%AF%D9%89%20%F0%9F%8E%93%E2%9C%A8"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Confirm attendance on WhatsApp"
    ></a>
  </section>

  <!-- MUSIC -->
  <audio id="bgMusic" loop preload="auto">
    <source src="music.mp3" type="audio/mpeg" />
  </audio>

  <button id="musicBtn" class="music-btn" type="button" aria-label="Music">
    ♪
  </button>

  <!-- PREVIOUS -->
  <button id="prevBtn" class="nav-arrow hidden" type="button" aria-label="Previous Page">
    ‹
  </button>

  <!-- SWIPE LABEL -->
  <div id="swipeLabel" class="swipe-label">
    اسحبي الصفحة
  </div>

  <!-- NEXT -->
  <button id="nextBtn" class="nav-arrow hidden" type="button" aria-label="Next Page">
    ›
  </button>

</div>

<script>
/* =====================================
   VARIABLES
===================================== */

const book = document.getElementById("book");
const pages = [...document.querySelectorAll(".page")];
const nextBtn = document.getElementById("nextBtn");
const prevBtn = document.getElementById("prevBtn");
const nadaVideo = document.getElementById("nadaVideo");
const bgMusic = document.getElementById("bgMusic");
const musicBtn = document.getElementById("musicBtn");
const swipeLabel = document.getElementById("swipeLabel");

let currentPage = 0;
let animating = false;
let musicPlaying = false;
let musicManuallyStopped = false;

/* =====================================
   NAVIGATION STATE
===================================== */

function updateNavigation() {
  if (currentPage === 0) {
    book.classList.add("first-page");
    prevBtn.classList.add("hidden");
    nextBtn.classList.add("hidden");
    return;
  }

  book.classList.remove("first-page");

  if (currentPage > 0) {
    prevBtn.classList.remove("hidden");
  } else {
    prevBtn.classList.add("hidden");
  }

  if (currentPage === pages.length - 1) {
    nextBtn.classList.add("hidden");
    swipeLabel.textContent = "الصفحة الأخيرة";
  } else {
    nextBtn.classList.remove("hidden");
    swipeLabel.textContent = "اسحبي الصفحة";
  }
}

/* =====================================
   NEXT PAGE
===================================== */

function nextPage() {
  if (animating) return;
  if (currentPage >= pages.length - 1) return;

  animating = true;

  const current = pages[currentPage];
  current.classList.add("flipping");

  requestAnimationFrame(() => {
    current.classList.add("flipped");
  });

  setTimeout(() => {
    current.classList.remove("flipping");
    currentPage++;
    updateNavigation();
    handleVideoPage();
    animating = false;
  }, 900);
}

/* =====================================
   PREVIOUS PAGE
===================================== */

function previousPage() {
  if (animating) return;
  if (currentPage <= 0) return;

  animating = true;

  const previous = pages[currentPage - 1];
  previous.classList.add("flipping");
  previous.classList.remove("flipped");

  setTimeout(() => {
    previous.classList.remove("flipping");
    currentPage--;
    updateNavigation();
    handleVideoPage();
    animating = false;
  }, 900);
}

/* =====================================
   BUTTONS
===================================== */

nextBtn.addEventListener("click", (event) => {
  event.stopPropagation();
  tryStartMusic();
  nextPage();
});

prevBtn.addEventListener("click", (event) => {
  event.stopPropagation();
  previousPage();
});

/* =====================================
   TOUCH SWIPE
===================================== */

let startX = 0;
let startY = 0;

book.addEventListener("touchstart", (event) => {
  if (event.target.closest("a") || event.target.closest("button")) return;

  const touch = event.touches[0];
  startX = touch.clientX;
  startY = touch.clientY;

  tryStartMusic();
}, { passive: true });

book.addEventListener("touchend", (event) => {
  if (event.target.closest("a") || event.target.closest("button")) return;

  const touch = event.changedTouches[0];
  const deltaX = touch.clientX - startX;
  const deltaY = touch.clientY - startY;

  if (Math.abs(deltaX) < 45) return;
  if (Math.abs(deltaX) < Math.abs(deltaY)) return;

  if (deltaX < 0) {
    nextPage();
  } else {
    previousPage();
  }
}, { passive: true });

/* =====================================
   POINTER DRAG
===================================== */

let dragging = false;
let pointerStartX = 0;

book.addEventListener("pointerdown", (event) => {
  if (event.target.closest("a") || event.target.closest("button")) return;

  dragging = true;
  pointerStartX = event.clientX;
  tryStartMusic();
});

book.addEventListener("pointerup", (event) => {
  if (!dragging) return;

  dragging = false;
  const deltaX = event.clientX - pointerStartX;

  if (Math.abs(deltaX) < 55) return;

  if (deltaX < 0) {
    nextPage();
  } else {
    previousPage();
  }
});

/* =====================================
   VIDEO
===================================== */

async function playNadaVideo() {
  try {
    nadaVideo.currentTime = 0;
    await nadaVideo.play();
  } catch (error) {
    console.log("Video could not autoplay", error);
  }
}

function handleVideoPage() {
  if (currentPage === 1) {
    playNadaVideo();
  } else {
    nadaVideo.pause();
  }
}

nadaVideo.addEventListener("ended", () => {
  if (currentPage !== 1) return;

  setTimeout(() => {
    nextPage();
  }, 150);
});

/* =====================================
   MUSIC
===================================== */

async function tryStartMusic() {
  if (musicManuallyStopped) return;
  if (musicPlaying) return;

  try {
    bgMusic.volume = 0.42;
    await bgMusic.play();
    musicPlaying = true;
    musicBtn.textContent = "♫";
  } catch (error) {}
}

musicBtn.addEventListener("click", async (event) => {
  event.stopPropagation();

  if (musicPlaying) {
    bgMusic.pause();
    musicPlaying = false;
    musicManuallyStopped = true;
    musicBtn.textContent = "♪";
    return;
  }

  try {
    musicManuallyStopped = false;
    bgMusic.volume = 0.42;
    await bgMusic.play();
    musicPlaying = true;
    musicBtn.textContent = "♫";
  } catch (error) {}
});

/* =====================================
   COUNTDOWN
===================================== */

const eventDate = new Date("2027-07-27T19:00:00+03:00");

function updateCountdown() {
  let difference = eventDate.getTime() - Date.now();
  if (difference < 0) difference = 0;

  const oneDay = 1000 * 60 * 60 * 24;
  const oneHour = 1000 * 60 * 60;
  const oneMinute = 1000 * 60;

  const days = Math.floor(difference / oneDay);
  const hours = Math.floor((difference % oneDay) / oneHour);
  const minutes = Math.floor((difference % oneHour) / oneMinute);
  const seconds = Math.floor((difference % oneMinute) / 1000);

  document.getElementById("days").textContent = days;
  document.getElementById("hours").textContent = String(hours).padStart(2, "0");
  document.getElementById("minutes").textContent = String(minutes).padStart(2, "0");
  document.getElementById("seconds").textContent = String(seconds).padStart(2, "0");
}

updateCountdown();
setInterval(updateCountdown, 1000);

/* =====================================
   START
===================================== */

updateNavigation();
</script>
</body>
</html>
