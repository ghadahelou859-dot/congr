<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Nada Graduation Invitation</title>

<style>

/* =====================================
   RESET
===================================== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:#eef6fb;

  display:flex;
  align-items:center;
  justify-content:center;

  font-family:Arial,sans-serif;
}


/* =====================================
   BOOK - ثابت على نسبة 9:16
===================================== */

.book{
  position:relative;

  width:min(
    100vw,
    calc(100vh * 9 / 16)
  );

  height:min(
    100vh,
    calc(100vw * 16 / 9)
  );

  overflow:hidden;

  background:#eef6fb;

  perspective:2200px;

  touch-action:none;
}


/* =====================================
   PAGE
===================================== */

.page{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  overflow:hidden;

  background:#eef6fb;

  transform-origin:left center;

  transform-style:preserve-3d;

  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;

  transition:
    transform .9s cubic-bezier(.55,.05,.25,1),
    opacity .45s ease;

  will-change:transform;
}


/* =====================================
   IMAGES
   بدون أي قص
===================================== */

.page > img{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  display:block;

  object-fit:contain;
  object-position:center center;

  background:#eef6fb;

  image-rendering:auto;

  pointer-events:none;

  user-select:none;
  -webkit-user-select:none;
  -webkit-user-drag:none;
}


/* =====================================
   PAGE ORDER
===================================== */

.page:nth-of-type(1){z-index:80;}
.page:nth-of-type(2){z-index:70;}
.page:nth-of-type(3){z-index:60;}
.page:nth-of-type(4){z-index:50;}
.page:nth-of-type(5){z-index:40;}
.page:nth-of-type(6){z-index:30;}
.page:nth-of-type(7){z-index:20;}
.page:nth-of-type(8){z-index:10;}


/* =====================================
   PAGE FLIP
===================================== */

.page.flipped{
  transform:rotateY(-180deg);
  pointer-events:none;
}


/* ظل خفيف أثناء التقليب */

.page::after{
  content:"";

  position:absolute;
  inset:0;

  z-index:5;

  pointer-events:none;

  opacity:0;

  background:
    linear-gradient(
      90deg,
      rgba(0,0,0,.18),
      rgba(0,0,0,.06) 15%,
      rgba(0,0,0,0) 40%
    );

  transition:opacity .45s ease;
}


.page.flipping::after{
  opacity:1;
}


/* =====================================
   VIDEO
===================================== */

.page-video{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  display:block;

  object-fit:contain;
  object-position:center center;

  background:#eef6fb;

  border:0;
  outline:0;

  pointer-events:none;
}


/* إخفاء شريط الفيديو */

video::-webkit-media-controls{
  display:none !important;
}

video::-webkit-media-controls-enclosure{
  display:none !important;
}

video::-webkit-media-controls-panel{
  display:none !important;
}

video::-webkit-media-controls-play-button{
  display:none !important;
}

video::-webkit-media-controls-start-playback-button{
  display:none !important;
}


/* =====================================
   MUSIC BUTTON
===================================== */

.music-btn{
  position:absolute;

  top:14px;
  right:14px;

  z-index:1000;

  width:48px;
  height:48px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:0;
  border-radius:50%;

  background:rgba(255,255,255,.94);

  color:#111;

  font-size:21px;

  cursor:pointer;

  box-shadow:
    0 5px 16px rgba(0,0,0,.15);
}


/* =====================================
   NAVIGATION ARROWS
===================================== */

.nav-arrow{
  position:absolute;

  bottom:18px;

  z-index:900;

  width:48px;
  height:48px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:0;
  border-radius:50%;

  background:rgba(255,255,255,.93);

  color:#222;

  font-size:30px;

  cursor:pointer;

  box-shadow:
    0 4px 14px rgba(0,0,0,.14);

  transition:
    opacity .25s ease,
    transform .25s ease;
}


#prevBtn{
  left:16px;
}


#nextBtn{
  right:16px;

  animation:
    nextArrowMove 1.3s ease-in-out infinite;
}


@keyframes nextArrowMove{

  0%,
  100%{
    transform:translateX(0);
  }

  50%{
    transform:translateX(-5px);
  }

}


.nav-arrow.hidden{
  opacity:0;
  pointer-events:none;
}


/* الصفحة الأولى بدون أسهم */

.book.first-page .nav-arrow{
  opacity:0;
  pointer-events:none;
}


/* =====================================
   SWIPE LABEL
===================================== */

.swipe-label{
  position:absolute;

  left:50%;
  bottom:25px;

  transform:translateX(-50%);

  z-index:850;

  padding:6px 13px;

  border-radius:20px;

  background:rgba(255,255,255,.88);

  color:#555;

  font-size:11px;

  white-space:nowrap;

  pointer-events:none;
}


.book.first-page .swipe-label{
  display:none;
}


/* =====================================
   COUNTDOWN
===================================== */

.countdown-overlay{
  position:absolute;

  inset:0;

  z-index:100;

  pointer-events:none;
}


/*
  كل رقم له صندوق مستقل
  ومتمركز داخل المربع
*/

.countdown-number{
  position:absolute;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:
    clamp(28px,8vw,46px);

  font-weight:500;

  color:#202020;

  line-height:1;

  transform:translate(-50%,-50%);
}


/*
  مراكز المربعات تقريباً
  بحسب تصميم countdown.png
*/


/* DAYS */
#days{
  left:31%;
  top:42%;
}


/* HOURS */
#hours{
  left:68%;
  top:42%;
}


/* MINUTES */
#minutes{
  left:31%;
  top:63%;
}


/* SECONDS */
#seconds{
  left:68%;
  top:63%;
}


/* =====================================
   LOCATION CLICK AREA
===================================== */

.location-click{
  position:absolute;

  left:18%;
  width:65%;

  bottom:8%;
  height:14%;

  z-index:500;

  display:block;

  background:transparent;
}


/* =====================================
   RSVP CLICK AREA
===================================== */

.rsvp-click{
  position:absolute;

  left:18%;
  width:64%;

  top:57%;
  height:12%;

  z-index:500;

  display:block;

  background:transparent;
}


/* =====================================
   DESKTOP
===================================== */

@media(min-width:700px){

  .book{
    box-shadow:
      0 20px 65px rgba(0,0,0,.16);
  }

}

</style>
</head>

<body>

<div
  class="book first-page"
  id="book"
>


<!-- =====================================
     PAGE 01 COVER
===================================== -->

<section class="page">

  <img
    src="cover.png"
    alt="Nada Graduation Cover"
  >

</section>


<!-- =====================================
     PAGE 02 VIDEO
===================================== -->

<section class="page">

  <video
    id="nadaVideo"
    class="page-video"

    playsinline
    webkit-playsinline

    preload="auto"

    muted

    disablepictureinpicture

    controlslist="nodownload noplaybackrate nofullscreen"
  >

    <source
      src="video.mp4"
      type="video/mp4"
    >

  </video>

</section>


<!-- =====================================
     PAGE 03 SAVE THE TIME
===================================== -->

<section class="page">

  <img
    src="savetime.png"
    alt="Save the Time"
  >

</section>


<!-- =====================================
     PAGE 04 DATE TIME
===================================== -->

<section class="page">

  <img
    src="date-time.png"
    alt="Date and Time"
  >

</section>


<!-- =====================================
     PAGE 05 COUNTDOWN
===================================== -->

<section class="page">

  <img
    src="countdown.png"
    alt="Countdown"
  >


  <div class="countdown-overlay">

    <div
      class="countdown-number"
      id="days">
    </div>

    <div
      class="countdown-number"
      id="hours">
    </div>

    <div
      class="countdown-number"
      id="minutes">
    </div>

    <div
      class="countdown-number"
      id="seconds">
    </div>

  </div>

</section>


<!-- =====================================
     PAGE 06 LOCATION
===================================== -->

<section class="page">

  <img
    src="location.png"
    alt="Jasmine Hall Hebron"
  >


  <a
    class="location-click"

    href="https://maps.app.goo.gl/1EMywhgSKpQ3VcEL6"

    target="_blank"

    rel="noopener noreferrer"

    aria-label="Open Location"
  ></a>

</section>


<!-- =====================================
     PAGE 07 DRESS CODE
===================================== -->

<section class="page">

  <img
    src="dress-code.png"
    alt="Dress Code"
  >

</section>


<!-- =====================================
     PAGE 08 CONFIRM ATTENDANCE
===================================== -->

<section class="page">

  <img
    src="rsvp.png"
    alt="Confirm Attendance"
  >


  <a
    class="rsvp-click"

    href="https://wa.me/970598494977?text=%D9%85%D8%B1%D8%AD%D8%A8%D8%A7%D9%8B%D8%8C%20%D8%A3%D8%A4%D9%83%D8%AF%20%D8%AD%D8%B6%D9%88%D8%B1%D9%8A%20%D9%84%D8%AD%D9%81%D9%84%20%D8%AA%D8%AE%D8%B1%D8%AC%20%D9%86%D8%AF%D9%89%20%F0%9F%8E%93%E2%9C%A8"

    target="_blank"

    rel="noopener noreferrer"

    aria-label="Confirm attendance on WhatsApp"
  ></a>

</section>


<!-- =====================================
     MUSIC
===================================== -->

<audio
  id="bgMusic"
  loop
  preload="auto"
>

  <source
    src="music.mp3"
    type="audio/mpeg"
  >

</audio>


<button
  id="musicBtn"
  class="music-btn"
  type="button"
  aria-label="Music"
>
♪
</button>


<!-- =====================================
     PREVIOUS
===================================== -->

<button
  id="prevBtn"
  class="nav-arrow hidden"
  type="button"
  aria-label="Previous Page"
>
‹
</button>


<!-- =====================================
     SWIPE LABEL
===================================== -->

<div
  id="swipeLabel"
  class="swipe-label"
>
اسحبي الصفحة
</div>


<!-- =====================================
     NEXT
===================================== -->

<button
  id="nextBtn"
  class="nav-arrow hidden"
  type="button"
  aria-label="Next Page"
>
›
</button>

</div>


<script>

/* =====================================
   VARIABLES
===================================== */

const book =
  document.getElementById("book");


const pages =
  [...document.querySelectorAll(".page")];


const nextBtn =
  document.getElementById("nextBtn");


const prevBtn =
  document.getElementById("prevBtn");


const nadaVideo =
  document.getElementById("nadaVideo");


const bgMusic =
  document.getElementById("bgMusic");


const musicBtn =
  document.getElementById("musicBtn");


const swipeLabel =
  document.getElementById("swipeLabel");


let currentPage = 0;

let animating = false;

let musicPlaying = false;

let musicManuallyStopped = false;


/* =====================================
   NAVIGATION STATE
===================================== */

function updateNavigation(){

  if(currentPage === 0){

    book.classList.add(
      "first-page"
    );


    prevBtn.classList.add(
      "hidden"
    );


    nextBtn.classList.add(
      "hidden"
    );


    return;

  }


  book.classList.remove(
    "first-page"
  );


  if(currentPage > 0){

    prevBtn.classList.remove(
      "hidden"
    );

  }

  else{

    prevBtn.classList.add(
      "hidden"
    );

  }


  if(
    currentPage ===
    pages.length - 1
  ){

    nextBtn.classList.add(
      "hidden"
    );


    swipeLabel.textContent =
      "الصفحة الأخيرة";

  }

  else{

    nextBtn.classList.remove(
      "hidden"
    );


    swipeLabel.textContent =
      "اسحبي الصفحة";

  }

}


/* =====================================
   NEXT PAGE
===================================== */

function nextPage(){

  if(animating){
    return;
  }


  if(
    currentPage >=
    pages.length - 1
  ){
    return;
  }


  animating = true;


  const current =
    pages[currentPage];


  current.classList.add(
    "flipping"
  );


  requestAnimationFrame(
    ()=>{

      current.classList.add(
        "flipped"
      );

    }
  );


  setTimeout(
    ()=>{

      current.classList.remove(
        "flipping"
      );


      currentPage++;


      updateNavigation();


      handleVideoPage();


      animating = false;

    },
    900
  );

}


/* =====================================
   PREVIOUS PAGE
===================================== */

function previousPage(){

  if(animating){
    return;
  }


  if(currentPage <= 0){
    return;
  }


  animating = true;


  const previous =
    pages[
      currentPage - 1
    ];


  previous.classList.add(
    "flipping"
  );


  previous.classList.remove(
    "flipped"
  );


  setTimeout(
    ()=>{

      previous.classList.remove(
        "flipping"
      );


      currentPage--;


      updateNavigation();


      handleVideoPage();


      animating = false;

    },
    900
  );

}


/* =====================================
   ARROW BUTTONS
===================================== */

nextBtn.addEventListener(
  "click",
  event=>{

    event.stopPropagation();

    tryStartMusic();

    nextPage();

  }
);


prevBtn.addEventListener(
  "click",
  event=>{

    event.stopPropagation();

    previousPage();

  }
);


/* =====================================
   TOUCH SWIPE
===================================== */

let startX = 0;
let startY = 0;


book.addEventListener(
  "touchstart",
  event=>{

    if(
      event.target.closest("a") ||
      event.target.closest("button")
    ){
      return;
    }


    const touch =
      event.touches[0];


    startX =
      touch.clientX;


    startY =
      touch.clientY;


    tryStartMusic();

  },
  {
    passive:true
  }
);


book.addEventListener(
  "touchend",
  event=>{

    if(
      event.target.closest("a") ||
      event.target.closest("button")
    ){
      return;
    }


    const touch =
      event.changedTouches[0];


    const deltaX =
      touch.clientX -
      startX;


    const deltaY =
      touch.clientY -
      startY;


    if(
      Math.abs(deltaX) < 45
    ){
      return;
    }


    if(
      Math.abs(deltaX) <
      Math.abs(deltaY)
    ){
      return;
    }


    if(deltaX < 0){

      nextPage();

    }

    else{

      previousPage();

    }

  },
  {
    passive:true
  }
);


/* =====================================
   DESKTOP DRAG
===================================== */

let dragging = false;
let pointerStartX = 0;


book.addEventListener(
  "pointerdown",
  event=>{

    if(
      event.target.closest("a") ||
      event.target.closest("button")
    ){
      return;
    }


    dragging = true;

    pointerStartX =
      event.clientX;


    tryStartMusic();

  }
);


book.addEventListener(
  "pointerup",
  event=>{

    if(!dragging){
      return;
    }


    dragging = false;


    const deltaX =
      event.clientX -
      pointerStartX;


    if(
      Math.abs(deltaX) < 55
    ){
      return;
    }


    if(deltaX < 0){

      nextPage();

    }

    else{

      previousPage();

    }

  }
);


/* =====================================
   VIDEO PAGE
===================================== */

async function playNadaVideo(){

  try{

    nadaVideo.currentTime = 0;

    await nadaVideo.play();

  }

  catch(error){

    console.log(
      "Video could not autoplay",
      error
    );

  }

}


function handleVideoPage(){

  if(currentPage === 1){

    playNadaVideo();

  }

  else{

    nadaVideo.pause();

  }

}


/* =====================================
   VIDEO ENDS -> NEXT PAGE
===================================== */

nadaVideo.addEventListener(
  "ended",
  ()=>{

    if(currentPage !== 1){
      return;
    }


    setTimeout(
      ()=>{

        nextPage();

      },
      150
    );

  }
);


/* =====================================
   MUSIC AUTO START
===================================== */

async function tryStartMusic(){

  if(musicManuallyStopped){
    return;
  }


  if(musicPlaying){
    return;
  }


  try{

    bgMusic.volume = 0.42;


    await bgMusic.play();


    musicPlaying = true;


    musicBtn.textContent =
      "♫";

  }

  catch(error){}

}


/* =====================================
   MUSIC BUTTON
===================================== */

musicBtn.addEventListener(
  "click",
  async event=>{

    event.stopPropagation();


    if(musicPlaying){

      bgMusic.pause();


      musicPlaying = false;


      musicManuallyStopped =
        true;


      musicBtn.textContent =
        "♪";


      return;

    }


    try{

      musicManuallyStopped =
        false;


      bgMusic.volume =
        0.42;


      await bgMusic.play();


      musicPlaying =
        true;


      musicBtn.textContent =
        "♫";

    }

    catch(error){}

  }
);


/* =====================================
   COUNTDOWN
===================================== */

const eventDate =
  new Date(
    "2027-07-27T19:00:00+03:00"
  );


function updateCountdown(){

  let difference =
    eventDate.getTime() -
    Date.now();


  if(difference < 0){

    difference = 0;

  }


  const oneDay =
    1000 *
    60 *
    60 *
    24;


  const oneHour =
    1000 *
    60 *
    60;


  const oneMinute =
    1000 *
    60;


  const days =
    Math.floor(
      difference /
      oneDay
    );


  const hours =
    Math.floor(
      (
        difference %
        oneDay
      ) /
      oneHour
    );


  const minutes =
    Math.floor(
      (
        difference %
        oneHour
      ) /
      oneMinute
    );


  const seconds =
    Math.floor(
      (
        difference %
        oneMinute
      ) /
      1000
    );


  document
  .getElementById("days")
  .textContent =
    days;


  document
  .getElementById("hours")
  .textContent =
    String(hours)
    .padStart(
      2,
      "0"
    );


  document
  .getElementById("minutes")
  .textContent =
    String(minutes)
    .padStart(
      2,
      "0"
    );


  document
  .getElementById("seconds")
  .textContent =
    String(seconds)
    .padStart(
      2,
      "0"
    );

}


updateCountdown();


setInterval(
  updateCountdown,
  1000
);


/* =====================================
   START
===================================== */

updateNavigation();

</script>

</body>
</html>
